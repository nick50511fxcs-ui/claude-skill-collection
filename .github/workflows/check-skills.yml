name: check-skills

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill count (max 50) and SKILL.md format
        run: bash scripts/check-skills.sh
      - name: Clean-HOME install simulation
        run: |
          T="$(mktemp -d)"
          HOME="$T" bash install.sh --copy
          for d in skills/*/; do test -f "$T/.claude/skills/$(basename "$d")/SKILL.md"; done
