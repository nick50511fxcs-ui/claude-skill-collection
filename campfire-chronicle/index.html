<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>끝없는 광산</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="모닥불 곁의 광부가 끝없이 파 내려가는 픽셀 채굴 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="scene" width="216" height="384" aria-label="광산 화면"></canvas>
    <div id="top"></div>
    <div id="side"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="bottom"></div>
    <div id="panel" hidden>
      <div class="panel-head"><h2 id="panelTitle"></h2><button type="button" class="x" id="panelClose" aria-label="닫기">✕</button></div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>
</div>
<div id="modal" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
