<title>모닥불 연대기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="한 명의 모험가를 키우는 방치형 픽셀 RPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&family=Silkscreen&display=swap">
<style>
/* Layout: a 16:9 pixel stage with an Idleon-style navy panel layer and a
   dark command bar below. Single deliberate dark look (night campfire). */
:root {
  color-scheme: dark;
  --bg: #0e0b16;
  --bg2: #171326;
  --bar: #1b1e2e;
  --bar-edge: #3a4064;
  --panel: #1e285c;
  --panel-edge: #b8c8f0;
  --panel-ink: #10142a;
  --slot: #4a4a58;
  --slot-edge: #2a2a34;
  --ink: #f4f1ff;
  --ink-dim: #b9b6d8;
  --ember: #ffb84a;
  --ember-deep: #ff6a3a;
  --hp: #e8444a;
  --sta: #3d8bff;
  --xp: #f0c43a;
  --good: #7be07b;
  --bad: #ff6a6a;
  --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --title: 'Noto Serif KR', 'Nanum Myeongjo', serif;
  --pixel: 'Silkscreen', 'Noto Sans KR', monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(ellipse at 50% 120%, #3a1e1a 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

#app {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ---------- Stage ---------- */
#stage {
  position: relative;
  aspect-ratio: 16 / 9;
  max-width: 100%;
  border: 3px solid #2a2440;
  border-radius: 6px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 0 0 2px #000, 0 16px 40px rgba(0, 0, 0, 0.6);
}
#scene { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
#overlay { position: absolute; inset: 0; pointer-events: none; }
#overlay > * { position: absolute; transform: translate(-50%, 0); white-space: nowrap; }
.nametag { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 2px; }
.nametag .nm { font-size: clamp(10px, 1.3vw, 14px); color: #fff; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
.nametag .badge {
  font-size: clamp(9px, 1.1vw, 12px); padding: 0 8px; border-radius: 3px;
  background: #1f3a1f; border: 1px solid #7be07b; color: #c8ffc0;
}
.monname {
  transform: translate(-50%, -100%) !important; font-size: clamp(10px, 1.2vw, 13px);
  color: #fff; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000;
}
.monname.boss { color: #ffd27a; }
.monname.v-golden { color: #ffe066; }
.monname.v-giant { color: #8ac8ff; }
.monname.v-ancient { color: #ff5f87; }
.bubble {
  transform: translate(-50%, -100%) !important;
  max-width: 46%; white-space: normal !important; text-align: center;
  background: #16204a; border: 2px solid #e8eeff; box-shadow: 0 0 0 2px #0a0e22;
  border-radius: 3px; padding: 4px 10px; font-size: clamp(11px, 1.35vw, 15px); line-height: 1.35;
}
.bubble::after {
  content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: #e8eeff;
}

#hudTL {
  position: absolute; left: 10px; top: 8px; display: flex; flex-direction: column; gap: 3px;
  font-size: clamp(11px, 1.3vw, 15px); text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000;
  pointer-events: none; max-width: 52%;
}
#hudTL .reg { font-family: var(--title); font-weight: 700; font-size: clamp(14px, 1.9vw, 22px); color: #fff; }
#hudTL .fl { color: var(--ember); }
#hudTL .env { color: #dfe6ff; }
#hudTL .recall { color: #ffe066; }
#hudTL .gm { color: #ffb0c8; background: rgba(40, 10, 30, 0.6); padding: 1px 6px; border-radius: 3px; white-space: normal; }
#hudTL .gm.ok { color: #b8ffb8; background: rgba(10, 40, 20, 0.6); text-decoration: line-through; }

#hudTR {
  position: absolute; right: 10px; top: 8px; width: min(36%, 300px);
  background: #16204a; border: 2px solid #e8eeff; box-shadow: 0 0 0 2px #0a0e22; border-radius: 3px;
  padding: 4px 10px 6px; font-size: clamp(10px, 1.2vw, 14px); pointer-events: none;
}
#hudTR .q-title { color: var(--ember); letter-spacing: 0.08em; font-family: var(--pixel); font-size: 0.85em; text-align: center; border-bottom: 1px solid #3a4a8a; margin-bottom: 3px; }
#goals { margin: 0; padding-left: 16px; line-height: 1.45; }

#clones { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 8px; }
.clone { width: clamp(110px, 17vw, 190px); border: 2px solid #9ab8ff; border-radius: 4px; overflow: hidden; background: #000; box-shadow: 0 0 0 2px #0a0e22; position: relative; }
.clone canvas { width: 100%; aspect-ratio: 16 / 9; height: auto; }
.clone-lb { position: absolute; left: 0; right: 0; top: 0; font-size: clamp(9px, 1vw, 12px); padding: 1px 5px; background: rgba(10, 20, 60, 0.75); color: #cfe0ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#toasts { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; width: 40%; }
.toast {
  background: rgba(12, 14, 34, 0.88); border: 1px solid var(--tc, #d6d6d6); color: var(--tc, #fff);
  padding: 2px 10px; border-radius: 3px; font-size: clamp(11px, 1.2vw, 14px); white-space: nowrap;
  animation: toast 3.2s ease forwards;
}
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

.banner {
  left: 50% !important; top: 30% !important; transform: translate(-50%, -50%) !important;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: rgba(10, 8, 24, 0.9); border: 3px solid currentColor; border-radius: 6px; padding: 10px 26px;
  animation: banner 0.5s cubic-bezier(0.2, 1.6, 0.4, 1);
}
.banner.tier3 { color: #c27bff; } .banner.tier4 { color: #ffbe4d; } .banner.tier5 { color: #ff5f87; }
.banner.tier6 { color: #8ffcff; animation: banner 0.8s cubic-bezier(0.2, 1.6, 0.4, 1), rainbow 2s linear infinite; }
.bn-tier { font-family: var(--pixel); letter-spacing: 0.12em; font-size: clamp(12px, 1.6vw, 18px); }
.bn-body { display: flex; align-items: center; gap: 12px; color: #fff; font-size: clamp(16px, 2.6vw, 30px); }
.bn-icon canvas { width: clamp(36px, 5vw, 56px); height: auto; image-rendering: pixelated; }
.banner small { color: #dfe6ff; font-size: clamp(10px, 1.1vw, 13px); }
@keyframes banner { from { transform: translate(-50%, -50%) scale(0.4); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
@keyframes rainbow { 0% { filter: hue-rotate(0); } 100% { filter: hue-rotate(360deg); } }
.blackout { inset: 0 !important; left: 0 !important; top: 0 !important; transform: none !important; background: #000; }
.blackout.on { animation: heartbeat 0.8s ease-in-out 2; }
.blackout.reveal { animation: reveal 1.2s ease forwards; }
@keyframes heartbeat { 0%, 100% { background: #000; } 30% { background: #2a0010; } 45% { background: #000; } 60% { background: #1a0010; } }
@keyframes reveal { from { opacity: 1; } to { opacity: 0; } }

/* Boss bar and warning */
.bossbar { left: 50% !important; top: 4% !important; transform: translateX(-50%) !important; width: min(46%, 420px); display: flex; flex-direction: column; gap: 3px; align-items: stretch; }
.bb-name { text-align: center; font-size: clamp(11px, 1.4vw, 16px); color: #fff; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb-track { height: clamp(8px, 1.2vw, 14px); background: #1a0a12; border: 2px solid #000; box-shadow: 0 0 0 1px #ff8aa8; border-radius: 3px; overflow: hidden; }
.bb-track i { display: block; height: 100%; background: linear-gradient(#ff8a9a, #e8244a 60%, #8a1028); transition: width 0.15s linear; }
.bossbar.elite .bb-track { box-shadow: 0 0 0 1px #ffd27a; }
.bossbar.elite .bb-track i { background: linear-gradient(#ffe0a0, #ffb84a 60%, #b8701a); }
.bosswarn { left: 50% !important; top: 42% !important; transform: translate(-50%, -50%) !important; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 28px; background: rgba(40, 0, 12, 0.82); border-top: 3px solid #ff2a4a; border-bottom: 3px solid #ff2a4a; width: 100%; animation: warn 0.6s ease; }
.bosswarn b { font-family: var(--pixel); letter-spacing: 0.2em; color: #ff5a7a; font-size: clamp(16px, 3vw, 34px); font-weight: 400; animation: blink 0.5s steps(2) 4; }
.bosswarn span { color: #fff; font-size: clamp(13px, 1.8vw, 20px); }
.bosswarn.elite { background: rgba(40, 24, 0, 0.75); border-color: #ffb84a; }
.bosswarn.elite b { color: #ffd27a; font-family: var(--font); letter-spacing: 0.05em; }
@keyframes warn { from { opacity: 0; transform: translate(-50%, -50%) scaleY(0.2) !important; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0.25; } }

/* Tutorial */
.tut-hl { position: relative; z-index: 30 !important; outline: 3px solid #ffd27a !important; outline-offset: 3px; border-radius: 6px; animation: tutpulse 1.2s ease-in-out infinite; }
@keyframes tutpulse { 50% { outline-color: rgba(255, 210, 122, 0.25); } }
#tutor {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 40;
  width: min(560px, calc(100% - 32px)); box-sizing: border-box;
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start;
  background: #16204a; border: 2px solid #ffd27a; box-shadow: 0 0 0 2px #0a0e22, 0 12px 30px rgba(0, 0, 0, 0.6); border-radius: 6px; padding: 12px 14px;
}
#tutor .tt-icon { width: 44px; height: 44px; }
#tutor .tt-step { font-family: var(--pixel); font-size: 10px; color: var(--ember); letter-spacing: 0.1em; }
#tutor .tt-text { font-size: 15px; line-height: 1.5; margin: 2px 0 8px; }
#tutor .tt-text b { color: #ffe0a0; font-weight: 400; }
#tutor .tt-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
#tutor .tt-skip { background: none; border: none; color: var(--ink-dim); font-size: 13px; text-decoration: underline; }
.skill-card.locked { background: #2e2e3a; border-color: #22222c; }
.skill-card.locked .sc-nm, .skill-card.locked .sc-lv { color: #8a8aa0; }
.skill-card .sc-lock { grid-column: span 2; font-size: 11px; color: #ffb0b0; }

/* ---------- Action strip: what to do now + combat skills ---------- */
#actionBar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: #151826; border: 2px solid #2e3452; border-radius: 6px; padding: 6px 8px; }
.dock { display: flex; gap: 6px; flex-wrap: wrap; }
.dk { position: relative; width: 46px; height: 46px; display: grid; place-items: center; background: linear-gradient(#2c3150, #20243a); border: 2px solid #4a5280; border-radius: 6px; }
.dk:hover:not(:disabled) { border-color: #9aa8e0; }
.dk.on { border-color: var(--ember); box-shadow: inset 0 0 0 1px var(--ember); background: linear-gradient(#4a3420, #2a1e14); }
.dk:disabled { opacity: 0.4; cursor: not-allowed; }
.dk .lk { position: absolute; right: 2px; bottom: 0; font-size: 11px; }
.dk-sep { width: 1px; background: #3a4064; margin: 4px 2px; }
.fight-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fever { display: flex; flex-direction: column; gap: 3px; width: 120px; font-size: 12px; color: #ffb0a0; }
.fv-track { height: 8px; background: #2a1414; border: 1px solid #000; border-radius: 3px; overflow: hidden; }
.fv-track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff8a3a, #ff3a5a); transition: width 0.2s; }
.fever.on { color: #fff2a0; }
.fever.on .fv-track i { width: 100% !important; background: linear-gradient(90deg, #ffe066, #ff8a3a, #ffe066); animation: fv 0.6s linear infinite; }
@keyframes fv { 50% { filter: brightness(1.4); } }
.cskills { display: flex; gap: 6px; align-items: center; }
.cs { position: relative; width: 52px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: linear-gradient(#3a2430, #261824); border: 2px solid #8a4a5a; border-radius: 6px; overflow: hidden; }
.cs:disabled { cursor: default; }
.cs .nm { font-size: 11px; }
.cs .key { position: absolute; left: 3px; top: 1px; font-family: var(--pixel); font-size: 9px; color: #ffb0c0; }
.cs .cdv { position: absolute; inset: 0; background: rgba(8, 6, 14, 0.72); display: grid; place-items: center; font-size: 13px; color: #fff; }
.cs.ready { border-color: #ff8aa8; box-shadow: 0 0 8px rgba(255, 120, 150, 0.35); }
.autocast { font-size: 11px; padding: 2px 6px; }
.minihint { transform: translate(-50%, -100%) !important; background: rgba(20, 16, 6, 0.85); border: 1px solid #ffd27a; color: #ffe8a0; border-radius: 3px; padding: 2px 8px; font-size: clamp(10px, 1.2vw, 13px); animation: hintpop 0.3s ease; }
@keyframes hintpop { from { opacity: 0; transform: translate(-50%, -70%) !important; } }
#scene { cursor: pointer; }

/* ---------- Command bar ---------- */
#bar {
  display: grid; grid-template-columns: auto minmax(180px, 1fr) auto; gap: 14px; align-items: center;
  background: var(--bar); border: 2px solid var(--bar-edge); border-radius: 6px; padding: 8px 10px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.05), 0 8px 24px rgba(0, 0, 0, 0.5);
}
.who { display: flex; align-items: center; gap: 10px; }
#portrait { width: 40px; height: 54px; background: #2a2f48; border: 2px solid #5a6494; border-radius: 4px; padding: 3px; box-sizing: content-box; }
.who-nm { font-size: 17px; }
.who-sub { color: var(--ink-dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.meter { position: relative; height: 16px; background: #0c0d16; border: 2px solid #000; border-radius: 3px; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; transition: width 0.2s linear; }
.meter.hp i { background: linear-gradient(#ff7a7a, var(--hp) 60%, #a82a30); }
.meter.sta i { background: linear-gradient(#7ab8ff, var(--sta) 60%, #2a5ab8); }
.meter.xp i { background: linear-gradient(#ffe48a, var(--xp) 60%, #b88a1a); }
.meter span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 13px; color: #fff; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000; font-variant-numeric: tabular-nums; }
.meter b { position: absolute; left: 4px; top: 0; font-family: var(--pixel); font-size: 9px; line-height: 13px; color: rgba(255, 255, 255, 0.75); font-weight: 400; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn {
  position: relative; width: 60px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: linear-gradient(#323858, #262a42); border: 2px solid #5a6494; border-radius: 6px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.08), 0 2px 0 #000;
}
.btn:hover { border-color: #9aa8e0; background: linear-gradient(#3c4468, #2c3150); }
.btn:active { transform: translateY(1px); }
.btn.active { border-color: var(--ember); box-shadow: inset 0 0 0 1px var(--ember), 0 2px 0 #000; }
.btn.on { background: linear-gradient(#5a3a1a, #3a2410); border-color: var(--ember); }
.btn .lbl { font-size: 12px; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000; }
.btn .dot { position: absolute; right: 4px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: #ff3a5a; border: 1px solid #000; }

/* ---------- Panel ---------- */
#panel {
  position: absolute; left: 10px; top: 10px; bottom: 10px; width: min(560px, calc(100% - 20px));
  display: flex; flex-direction: column;
  background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 5px;
  box-shadow: 0 0 0 3px var(--panel-ink), 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 5;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 6px; border-bottom: 2px solid #4a5aa8; }
.panel-head h2 { margin: 0; font-family: var(--title); font-size: 20px; font-weight: 700; color: #fff; }
.panel-head .x { width: 34px; height: 34px; background: #2a1a2a; border: 2px solid #c88aa8; border-radius: 4px; color: #ffc0d8; }
.panel-body { overflow-y: auto; padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 10px; scrollbar-color: #6a7ac8 transparent; }
.psec { background: rgba(10, 14, 40, 0.45); border: 1px solid #4a5aa8; border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.psec h3 { margin: 0; font-size: 15px; font-weight: 400; color: var(--ember); }
.psec h4 { margin: 4px 0 0; font-size: 14px; font-weight: 400; color: #cfe0ff; }
.hint { margin: 0; color: var(--ink-dim); font-size: 13px; line-height: 1.45; }
.warn { margin: 0; color: #ffb0b0; }
.statlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 16px; font-size: 14px; }
.statlist > div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted rgba(184, 200, 240, 0.25); padding-bottom: 2px; min-width: 0; }
.statlist span { color: var(--ink-dim); }
.statlist b { font-weight: 400; text-align: right; font-variant-numeric: tabular-nums; }
.pbtn {
  background: linear-gradient(#4a5aa8, #36428a); border: 2px solid #9aa8e0; border-radius: 4px; padding: 3px 10px; font-size: 13px;
  box-shadow: 0 2px 0 #10142a;
}
.pbtn:hover:not(:disabled) { background: linear-gradient(#5a6ac0, #4250a0); }
.pbtn:disabled { opacity: 0.45; cursor: default; }
.pbtn.big { padding: 8px 18px; font-size: 16px; background: linear-gradient(#ff9a3a, #c8601a); border-color: #ffd8a0; }
.pbtn.danger { background: linear-gradient(#b83a4a, #8a2232); border-color: #ffa8b8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: #232a5a; border-color: #5a6aa8; }
.chip.on { background: linear-gradient(#ff9a3a, #c8601a); border-color: #ffd8a0; color: #fff; }

.char-top { display: flex; gap: 14px; align-items: center; }
.char-pic { width: 66px; height: 90px; background: #3a4278; border: 2px solid #9aa8e0; border-radius: 4px; padding: 6px; box-sizing: content-box; }
.char-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.char-nm { font-size: 20px; }
.char-nm .lv { color: var(--ember); font-size: 15px; }
.char-sub { color: var(--ink-dim); font-size: 13px; }
.char-sub b { color: #fff; font-weight: 400; }
.alloc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.alloc-row { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 6px; align-items: center; }
.alloc-row b { font-weight: 400; font-variant-numeric: tabular-nums; }
.gear-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; }
.gear-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.gear-txt em { font-style: normal; font-size: 12px; margin-left: 4px; color: var(--ink-dim); }
.gear-txt em.up { color: var(--good); }
.gear-txt em.down { color: var(--bad); }
.gear-txt { display: flex; flex-direction: column; min-width: 0; }
.gear-txt b { font-weight: 400; }
.gear-txt small, .spot-txt small, .recipe-txt small, .rare-row small, .ii-txt small, .perk small, .hall-row small { color: var(--ink-dim); font-size: 12px; }

.slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slot { display: grid; grid-template-columns: 26px auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; background: #232a5a; border: 2px solid #5a6aa8; border-radius: 4px; padding: 4px 10px 4px 6px; }
.slot canvas { grid-row: span 2; }
.slot.main { border-color: var(--ember); }
.slot small { color: var(--ink-dim); font-size: 11px; }
.slot b { font-weight: 400; }
.slot em { grid-column: 2; color: var(--bad); font-style: normal; font-size: 11px; }
.skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.skill-card {

// Seeded RNG (mulberry32). The state lives in the save file, so reloading the
// page replays the same rolls instead of re-rolling a rare drop.
function makeRng(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.getState = () => s;
  return rng;
}

function hash32(n) {
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

    rb: { count: 0, ash: 0, totalAsh: 0, perks: {}, memory: null, choices: null, bestFloor: 1, bestLv: 1 },
    stats: { kills: 0, deaths: 0, bosses: 0, actions: 0, gold: 0 },
    hall: [], log: [], firstKills: {},
    tut: { step: 0, done: false, tips: {} },
    settings: { autoEquip: false },
  };
}

// A life skill is open once the skill before it reached its level (or it was already played).
function isUnlocked(s, k) {
  const u = UNLOCKS[k];
  if (!u) return true;
  return s.skills[u.skill].lv >= u.lv || s.skills[k].lv > 1;
}

// Fill in fields added in later versions so old saves keep loading.
function migrate(raw) {
  const base = newState(raw.seed);
  const s = { ...base, ...raw };
  s.settings = { ...base.settings, ...(raw.settings || {}) };
  s.char = { ...freshChar(1), ...raw.char, st: { ...base.char.st, ...(raw.char?.st || {}) }, gear: { ...base.char.gear, ...(raw.char?.gear || {}) } };
  for (const k of Object.keys(base.skills)) s.skills[k] = { ...base.skills[k], ...(raw.skills?.[k] || {}) };
  s.rb = { ...base.rb, ...(raw.rb || {}) };
  s.stats = { ...base.stats, ...(raw.stats || {}) };
  s.potAuto = { ...base.potAuto, ...(raw.potAuto || {}) };
  s.elixirs = { ...base.elixirs, ...(raw.elixirs || {}) };
  s.act = { ...base.act, ...(raw.act || {}), cd: { ...base.act.cd, ...((raw.act && raw.act.cd) || {}) } };
  s.tut = { ...base.tut, ...(raw.tut || {}), tips: { ...((raw.tut && raw.tut.tips) || {}) } };
  s.v = VERSION;
  return s;
}

const VARIANTS = {
  golden: { name: '황금 ', hp: 2, atk: 1, xp: 2, gold: 10 },
  giant: { name: '거대 ', hp: 5, atk: 1.5, xp: 10, gold: 5 },
  ancient: { name: '고대 ', hp: 20, atk: 2, xp: 100, gold: 50 },
};
const NO_VARIANT = { name: '', hp: 1, atk: 1, xp: 1, gold: 1 };

class Game {
  constructor(state, opts = {}) {
    this.s = state;
    this.rng = makeRng(state.rng);
    this.clock = opts.clock || (() => Date.now());
    this.quiet = !!opts.quiet; // simulator: skip logs
    this.simStep = opts.simStep || 0;
    this.events = [];
    this.live = true;
    this.summary = null;
    this.mon = null;
    this.heroTimer = 0.3;
    this.monTimer = 1;
    this.lastEnv = -1e9;
    this.env = this.envNow();
    this.dirty = true;
    this.calc();
    const c = state.char;
    c.hp = Math.min(c.hp, this.d.hp);
    c.sta = Math.min(c.sta, this.d.sta);
  }

  // ---------- Infrastructure ----------
  emit(e) {
    if (this.live) this.events.push(e);
    if (this.summary) this.summarize(e);
  }
  log(text, tier = 0) {
    if (this.quiet) return;
    this.s.log.unshift({ at: this.clock(), text, tier });
    if (this.s.log.length > 80) this.s.log.length = 80;
  }
  has(id) { return !!this.s.codex[id]; }
  // Primordial items stack: every duplicate adds a little more to its effect.
  // Capped at 10 duplicates so faster gathering cannot feed itself without limit.
  prim(id, base, per) { const n = Math.min(11, this.s.items[id] || 0); return n ? base + per * (n - 1) : 0; }
  P(id) { return this.s.rb.perks[id] || 0; }
  serialize() {
    this.s.rng = this.rng.getState();
    this.s.lastSeen = this.clock();
    return JSON.stringify(this.s);
  }

  envNow() {
    const t = this.clock();
    const d = new Date(t);
    const h = d.getHours();
    const m = d.getMonth();
    const season = m >= 2 && m <= 4 ? 0 : m >= 5 && m <= 7 ? 1 : m >= 8 && m <= 10 ? 2 : 3;
    const w = hash32((Math.floor(t / 3600000) * 2654435761) ^ 0x9e37);
    const weather = w < 0.18 ? (season === 3 ? 'snow' : 'rain') : 'clear';
    return { night: h >= 20 || h < 6, hour: h + d.getMinutes() / 60, season, weather };
  }

  // ---------- Derived stats ----------
  calc() {
    const s = this.s, c = s.char, st = c.st, sk = s.skills, mem = s.rb.memory, pot = s.pot, env = this.env;
    const pb = k => skillPassive(sk[k].lv);
    const master = k => sk[k].lv >= 1000;
    let codex = 0;
    for (const id in s.codex) codex += TIERS[ITEMS[id].tier].codex;
    const potPow = (1 + pb('alchemy')) * (this.prim('a_prim', 2, 0.1) || 1) * (master('alchemy') ? 2 : 1);
    const allMul = (this.prim('c_prim', 1.05, 0.02) || 1) * (1 + 0.03 * s.elixirs.all);
    const g = c.gear;
    const wAtk = g.weapon ? gearValue(g.weapon) : 0;
    const aHp = g.armor ? gearValue(g.armor) : 0;
    const ch = g.charm ? charmValue(g.charm) : { luck: 0, crit: 0 };
    const aff = { atk: 0, hp: 0, spd: 0, crit: 0, critD: 0, luck: 0, sta: 0, xp: 0 };
    for (const sl of ['weapon', 'armor', 'charm']) if (g[sl] && g[sl].affix) aff[AFFIXES[g[sl].affix].stat] += affixValue(g[sl]);

    let atk = (4 + st.str * 2 + wAtk) * (1 + pb('mining')) * (1 + pb('combat')) * (1 + codex)
      * (1 + 0.1 * this.P('w_atk')) * (1 + 0.02 * s.elixirs.atk) * allMul * (1 + aff.atk);
    if (pot.str) atk *= 1 + 0.25 * potPow;
    atk *= this.prim('m_prim', 1.5, 0.1) || 1;
    if (master('mining')) atk *= 1.25;
    if (master('combat')) atk *= 1.25;
    if (mem === 'coward') atk *= 0.9;
    if (mem === 'warrior') atk *= 1.15;

    let hp = (40 + st.vit * 8 + c.lv * 4 + aHp) * (1 + pb('forage')) * (1 + pb('combat')) * (1 + codex)
      * (1 + 0.1 * this.P('w_hp')) * (1 + 0.02 * s.elixirs.hp) * allMul * (1 + aff.hp);
    if (pot.hp) hp *= 1 + 0.25 * potPow;
    if (master('forage')) hp *= 1.25;
    if (master('combat')) hp *= 1.25;

    let sta = 100 * (1 + st.vit * 0.005) * (1 + pb('wood')) * (1 + 0.02 * s.elixirs.sta) * (1 + aff.sta);
    if (pot.sta) sta *= 1 + 0.4 * potPow;

    const luckCap = LUCK_CAP + this.prim('f_prim', 0.5, 0.1) + (master('fish') ? 0.5 : 0);
    let luck = 1 + st.luk * 0.002 + sk.fish.lv * 0.0005 + Math.floor(sk.fish.lv / 10) * 0.005
      + 0.05 * this.P('a_luck') + ch.luck + (mem === 'lucky' ? 0.5 : 0) + (pot.luck ? 0.3 * potPow : 0)
      + 0.01 * s.elixirs.luck + aff.luck;
    luck = Math.min(luckCap, luck);

    const critC = Math.min(0.75, 0.05 + st.luk * 0.003 + ch.crit + aff.crit + (pot.focus ? 0.1 * potPow : 0));
    const critD = (1.5 + pb('hunt') + this.prim('h_prim', 1, 0.2)) * (master('hunt') ? 1.5 : 1) * (1 + 0.02 * s.elixirs.crit) * (1 + aff.critD);
    const interval = Math.max(0.2, 1.4 / (1 + st.agi * 0.008) / (1 + 0.01 * s.elixirs.agi) / (1 + aff.spd) / (pot.haste ? 1 + 0.25 * potPow : 1));
    const dodge = Math.min(0.6, st.agi * 0.002 + (mem === 'coward' ? 0.3 : 0));
    const nightXp = env.night ? this.prim('s_prim', 1.3, 0.05) || 1 : 1;

    this.d = {
      atk, hp, sta, luck, luckCap, critC, critD, interval, dodge, potPow, codex,
      res: { poison: Math.min(1, sk.forage.lv / 60), ice: Math.min(1, sk.wood.lv / 80) },
      lifeSpeed: (1 + 0.03 * this.P('a_speed')) * (this.prim('w_prim', 1.25, 0.05) || 1) * (master('wood') ? 1.15 : 1),
      lifeXp: (1 + 0.05 * this.P('a_xp')) * (1 + 0.02 * s.elixirs.lifexp) * nightXp,
      charXp: (1 + 0.15 * this.P('w_xp')) * this.rebirthXp() * nightXp * (1 + aff.xp) * (pot.wisdom ? 1 + 0.3 * potPow : 1),
      gold: (1 + 0.2 * this.P('r_gold')) * (mem === 'rich' ? 3 : 1),
      campDur: 60 * (mem === 'sleepy' ? 1.5 : 1),
    };
    this.dirty = false;
  }

  skillSpeed(k) {
    const sk = this.s.skills[k];
    return this.d.lifeSpeed * (1 + 0.1 * toolTier(sk.lv)) * (k === 'forage' && this.env.weather === 'rain' ? 1.2 : 1)
      * (this.s.gatherUntil > this.s.time ? 1.3 : 1) * (this.fever() ? 2 : 1);
  }
  skillXpMult(k) {
    const mem = this.s.rb.memory;
    return this.d.lifeXp * (mem && MEMORIES[mem].skill === k ? 2 : 1) * (k === 'combat' && mem === 'warrior' ? 2 : 1);
  }
  rareMult(k) {
    const sk = this.s.skills[k];
    return this.d.luck * (sk.lv >= 750 ? 1.5 : 1) * (this.s.catUntil > this.s.time && k !== 'combat' ? 1.5 : 1)
      * (k === 'fish' && this.env.night ? 1.3 : 1) * (this.burstMult || 1);
  }

  // ---------- Main loop ----------
  advance(sec, live = true) {
    this.live = live;
    const stepMax = live ? 0.1 : this.simStep || 0.5;
    let left = sec;
    while (left > 1e-9) {
      const dt = Math.min(stepMax, left);
      this.step(dt);
      left -= dt;
    }
    this.live = true;
  }

  fastForward(sec) {
    const c = this.s.char;
    const startLv = c.lv, startFloor = c.maxFloor, startGold = this.s.stats.gold;
    const skillStart = Object.fromEntries(Object.entries(this.s.skills).map(([k, v]) => [k, v.lv]));
    this.summary = { sec, kills: 0, deaths: 0, drops: [0, 0, 0, 0, 0, 0, 0], best: [], records: 0, codex: [], fails: 0, rebirth: false };
    this.advance(sec, false);
    const sm = this.summary;
    this.summary = null;
    sm.charLv = [startLv, this.s.char.lv];
    sm.floor = [startFloor, this.s.char.maxFloor];
    sm.gold = this.s.stats.gold - startGold;
    sm.skills = Object.entries(this.s.skills).filter(([k, v]) => v.lv > skillStart[k]).map(([k, v]) => ({ k, from: skillStart[k], to: v.lv }));
    return sm;
  }

  summarize(e) {
    const sm = this.summary;
    if (e.t === 'kill') sm.kills++;
    else if (e.t === 'death') sm.deaths++;
    else if (e.t === 'drop') {
      sm.drops[e.tier] += e.n;
      if (e.tier >= 3) sm.best.push(e.id);
    } else if (e.t === 'record') sm.records++;
    else if (e.t === 'codex') sm.codex.push(e.id);
    else if (e.t === 'act' && e.kind === 'fail') sm.fails++;
  }

  step(dt) {
    const s = this.s;
    s.time += dt;
    if (s.time - this.lastEnv >= 60) {
      this.env = this.envNow();
      this.lastEnv = s.time;
      this.dirty = true;
    }
    if (this.dirty) this.calc();
    const cloneSpeed = CLONE_SPEED * (1 + 0.05 * this.P('r_offline'));
    for (let i = 1; i < s.slots.length; i++) this.lifeTick(s.slots[i], i, dt * cloneSpeed);
    if (s.mode === 'fight') this.fightStep(dt);
    else this.campStep(dt);
  }

  // ---------- Camp & life skills ----------
  enterCamp(reason) {
    const s = this.s;
    s.mode = 'camp';
    s.pot = {};
    this.mon = null;
    this.dirty = true;
    this.emit({ t: 'camp', reason });
  }

  enterFight() {
    const s = this.s, c = s.char;
    s.mode = 'fight';
    s.pot = {};
    this.calc();
    const gm = this.gimmick(c.floor);
    for (const id of ['p_str', 'p_hp', 'p_sta', 'p_luck', 'p_haste', 'p_focus', 'p_wisdom', 'p_antidote', 'p_warm']) {
      const type = ITEMS[id].potion;
      if (!s.potAuto[type] || !(s.items[id] > 0)) continue;
      if (type === 'antidote' && (gm !== 'poison' || this.d.res.poison >= 1)) continue;
      if (type === 'warm' && (gm !== 'ice' || this.d.res.ice >= 1)) continue;
      s.items[id]--;
      s.pot[type] = true;
    }
    this.calc();
    c.hp = this.d.hp;
    c.sta = this.d.sta;
    this.emit({ t: 'fight', pots: Object.keys(s.pot) });
  }

  campStep(dt) {
    const s = this.s, c = s.char, d = this.d;
    c.sta = Math.min(d.sta, c.sta + (d.sta / d.campDur) * dt);
    c.hp = Math.min(d.hp, c.hp + (d.hp / (d.campDur * 0.6)) * dt);
    this.lifeTick(s.slots[0], 0, dt);
    if (!s.focus && c.sta >= d.sta && c.hp >= d.hp) this.enterFight();
  }

  recipe() { return RECIPES.find(r => r.id === this.s.recipe); }
  canCraft(r) {
    if (!r) return false;
    const s = this.s;
    if (r.secret && !s.secret) return false;
    if (s.skills.alchemy.lv < r.lv) return false;
    if (r.max && this.crafted(r) >= r.max) return false;
    for (const id in r.in) if ((s.items[id] || 0) < r.in[id]) return false;
    return true;
  }
  crafted(r) {
    const e = ITEMS[r.id].elixir;
    return e ? this.s.elixirs[e] : 0;
  }

  lifeTick(slot, idx, dt) {
    const k = slot.k;
    if (k === 'alchemy' && !this.canCraft(this.recipe())) { slot.p = 0; slot.blocked = true; return; }
    slot.blocked = false;
    slot.p += (dt * this.skillSpeed(k)) / (k === 'alchemy' ? ALCH_TIME : ACTION_TIME);
    while (slot.p >= 1) {
      slot.p -= 1;
      if (k === 'alchemy') {
        this.alchemyAction(idx);
        if (!this.canCraft(this.recipe())) { slot.p = 0; break; }
      } else this.gatherAction(k, idx);
    }
  }

  rollTier(k, mult) {
    const sk = this.s.skills[k];
    // Luck only counts as its square root for myth/primordial, so they stay rare.
    const top = Math.sqrt(mult);
    const eM = 1 / (TIER_P[5] * top), eP = 1 / (TIER_P[6] * top);
    const pityM = pity(sk.dryM / eM), pityP = pity(sk.dryP / eP);
    let r = this.rng();
    const p6 = TIER_P[6] * top * pityP;
    if (r < p6) { sk.dryP = 0; sk.dryM++; return 6; }
    r -= p6;
    const p5 = TIER_P[5] * top * pityM;
    if (r < p5) { sk.dryM = 0; sk.dryP++; return 5; }
    r -= p5;
    sk.dryM++;
    sk.dryP++;
    for (let t = 4; t >= 2; t--) {
      const p = TIER_P[t] * mult;
      if (r < p) return t;
      r -= p;
    }
    return r < TIER_P[1] ? 1 : 0;
  }

  gatherAction(k, slot) {
    const s = this.s, sk = s.skills[k];
    const spot = Math.min(s.spots[k], spotsUnlocked(sk.lv) - 1);
    const tier = this.rollTier(k, this.rareMult(k));
    let id;
    if (tier >= 3) id = this.pick(SKILL_RARES[k], tier);
    else {
      id = this.pick(SPOTS[k][spot].items, tier);
      if (k === 'fish' && tier === 2 && this.rng() < 0.3) id = this.pick(SEASON_FISH.filter(f => ITEMS[f].season === this.env.season), 2);
    }
    const dbl = sk.lv >= 500 ? 0.1 : sk.lv >= 250 ? 0.05 : 0;
    const n = dbl && tier < 3 && this.rng() < dbl ? 2 : 1;
    sk.n++;
    s.stats.actions++;
    let w = 0;
    if (ITEMS[id].w) w = this.fishRecord(id);
    this.gain(id, n, k);
    this.skillXp(k, SPOT_XP[spot] * this.skillXpMult(k));
    this.emit({ t: 'act', k, slot, id, tier, n, w });
  }

  // Random item of a tier from a list.
  pick(list, tier) {
    const pool = list.filter(id => ITEMS[id].tier === tier);
    return pool.at(Math.floor(this.rng() * pool.length)) || list.at(0);
  }

  gauss() {
    const u = Math.max(1e-12, this.rng()), v = this.rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  fishRecord(id) {
    const w = +(ITEMS[id].w * Math.exp(0.35 * this.gauss())).toFixed(2);
    const rec = this.s.records[id];
    if (!rec || w > rec) {
      this.s.records[id] = w;
      if (rec) {
        this.emit({ t: 'record', id, w });
        this.log(`신기록! ${ITEMS[id].name} ${w}kg`, 2);
      }
    }
    return w;
  }

  alchemyAction(slot) {
    const s = this.s, sk = s.skills.alchemy, r = this.recipe();
    for (const id in r.in) s.items[id] -= r.in[id];
    const noFail = this.has('a_prim') || s.rb.memory === 'alchem';
    const failP = noFail ? 0 : Math.max(0, 0.15 - sk.lv * 0.002);
    const roll = this.rng();
    let kind = 'ok', n = 1;
    if (roll < failP) { kind = 'fail'; n = 0; }
    else if (roll < failP + 0.001) { kind = 'miracle'; n = 10; }
    else if (roll < failP + 0.051 || s.act.alchGreat > 0) { kind = 'great'; n = 2; }
    if (s.act.alchGreat > 0) s.act.alchGreat--;
    if (n) {
      const it = ITEMS[r.id];
      if (r.max) n = Math.min(n, r.max - this.crafted(r));
      if (it.elixir) {
        s.elixirs[it.elixir] += n;
        this.register(r.id);
        this.dirty = true;
        this.emit({ t: 'drop', id: r.id, n, tier: it.tier, src: 'alchemy' });
      } else this.gain(r.id, n, 'alchemy');
    }
    if (kind === 'miracle') this.log(`연금술 기적! ${ITEMS[r.id].name} ×10`, 4);
    if (!s.secret && this.rng() < 0.00001 * this.d.luck) {
      s.secret = true;
      this.log('미지의 레시피를 발견했다! ???의 영약', 5);
      this.emit({ t: 'secret' });
    }
    const t = this.rollTier('alchemy', this.rareMult('alchemy'));
    if (t >= 3) this.gain(this.pick(SKILL_RARES.alchemy, t), 1, 'alchemy');
    sk.n++;
    s.stats.actions++;
    this.skillXp('alchemy', r.xp * (kind === 'fail' ? 1.5 : 1) * this.skillXpMult('alchemy'));
    this.emit({ t: 'act', k: 'alchemy', slot, id: r.id, kind, n, tier: ITEMS[r.id].tier });
  }

  register(id) {
    const s = this.s, it = ITEMS[id];
    if (s.codex[id]) return;
    s.codex[id] = 1;
    this.dirty = true;
    this.emit({ t: 'codex', id });
    this.log(`도감 등록: ${it.name}`, it.tier);
  }

  gain(id, n, src) {
    const s = this.s, it = ITEMS[id];
    s.items[id] = (s.items[id] || 0) + n;
    this.register(id);
    if (it.tier >= 4) {
      s.hall.unshift({ id, at: this.clock(), n: s.skills[src] ? s.skills[src].n : 0, src });
      if (s.hall.length > 60) s.hall.length = 60;
      this.log(`[${TIERS[it.tier].name}] ${it.name} 획득!`, it.tier);
    }
    this.emit({ t: 'drop', id, n, tier: it.tier, src });
  }

  skillXp(k, x) {
    const sk = this.s.skills[k];
    sk.xp += x;
    while (sk.xp >= xpNeed(sk.lv)) {
      sk.xp -= xpNeed(sk.lv);
      sk.lv++;
      this.dirty = true;
      const m = milestoneAt(k, sk.lv);
      this.emit({ t: 'slv', k, lv: sk.lv, m });
      for (const k2 in UNLOCKS) {
        const u = UNLOCKS[k2];
        if (u && u.skill === k && u.lv === sk.lv && this.s.skills[k2].lv === 1) {
          this.log(`새 생활 스킬 해금: ${SKILLS[k2].name}`, 4);
          this.emit({ t: 'unlock', k: k2 });
        }
      }
      if (m && (sk.lv % 10 !== 0 || sk.lv % 50 === 0)) this.log(`${SKILLS[k].name} Lv.${sk.lv} · ${m}`, sk.lv % 100 === 0 ? 3 : 2);
    }
  }

  useItem(id) {
    const s = this.s;
    if (!(s.items[id] > 0)) return false;
    if (id === 'x_cat') { s.catUntil = Math.max(s.time, s.catUntil) + 3600; this.log('행운의 촉매 사용: 1시간 동안 생활 희귀 확률 ×1.5', 2); }
    else if (id === 't_gather') { s.gatherUntil = Math.max(s.time, s.gatherUntil) + 1800; this.log('장인의 강장제 사용: 30분 동안 생활 속도 ×1.3', 2); }
    else if (id === 't_fever') this.addFever(100);
    else return false;
    s.items[id]--;
    return true;
  }

  // ---------- Active play (all optional; idle play never needs it) ----------
  fever() { return this.s.act.feverUntil > this.s.time; }
  addFever(x) {
    const a = this.s.act;
    if (this.fever()) return;
    a.fever = Math.min(100, a.fever + x);
    if (a.fever >= 100) {
      a.fever = 0;
      a.feverUntil = this.s.time + FEVER_SEC;
      this.emit({ t: 'fever' });
      this.log('열정 폭발! 30초 동안 모든 속도 ×2', 3);
    }
  }
  rage() { return this.s.act.rageUntil > this.s.time; }
  cdLeft(id) { return Math.max(0, this.s.act.cd[id] - this.s.time); }
  castSkill(id) {

const silCache = new WeakMap();
function silhouette(img, color) {
  let m = silCache.get(img);
  if (!m) { m = new Map(); silCache.set(img, m); }
  if (m.has(color)) return m.get(color);
  const c = makeCanvas(img.width, img.height);
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = color;
  x.fillRect(0, 0, img.width, img.height);
  m.set(color, c);
  return c;
}

// Draw a sprite rotated around a pivot with nearest-neighbour sampling, so it stays crisp.
const rotCache = new Map();
function drawRotated(ctx, img, x, y, px, py, angle, flip = false) {
  const q = Math.round(angle / (Math.PI / 32));
  const key = img;
  let byAngle = rotCache.get(key);
  if (!byAngle) { byAngle = new Map(); rotCache.set(key, byAngle); }
  const ck = q + (flip ? 'f' : '') + ',' + px + ',' + py;
  let entry = byAngle.get(ck);
  if (!entry) {
    const a = (q * Math.PI) / 32;
    const w = img.width, h = img.height;
    const R = Math.ceil(Math.hypot(Math.max(px, w - px), Math.max(py, h - py))) + 1;
    const out = makeCanvas(R * 2, R * 2);
    const octx = out.getContext('2d');
    const src = img.getContext('2d').getImageData(0, 0, w, h).data;
    const dst = octx.createImageData(R * 2, R * 2);
    const cos = Math.cos(-a), sin = Math.sin(-a);
    for (let dy = 0; dy < R * 2; dy++) {
      for (let dx = 0; dx < R * 2; dx++) {
        const rx = dx - R + 0.5, ry = dy - R + 0.5;
        let sx = Math.floor(rx * cos - ry * sin + px);
        const sy = Math.floor(rx * sin + ry * cos + py);
        if (flip) sx = w - 1 - sx;
        if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
        const si = (sy * w + sx) * 4, di = (dy * R * 2 + dx) * 4;
        if (src[si + 3] === 0) continue;
        dst.data[di] = src[si]; dst.data[di + 1] = src[si + 1]; dst.data[di + 2] = src[si + 2]; dst.data[di + 3] = 255;
      }
    }
    octx.putImageData(dst, 0, 0);
    entry = { c: out, R };
    byAngle.set(ck, entry);
  }
  ctx.drawImage(entry.c, Math.round(x - entry.R), Math.round(y - entry.R));
}

// ---------------- Characters ----------------
// Grids are drawn as fills only; ol() pads them by a pixel and adds the 1px outline around the
// silhouette, so every character gets the same clean black edge. 'o' inside a grid is a drawn line.
function ol(rows) {
  const w = Math.max(...rows.map(r => r.length)) + 2, h = rows.length + 2;
  const g = Array.from({ length: h }, (_, y) => Array.from({ length: w }, (_, x) => {
    const ch = (rows[y - 1] || '')[x - 1];
    return ch && ch !== ' ' ? ch : '.';
  }));
  const filled = (x, y) => y >= 0 && y < h && x >= 0 && x < w && g[y][x] !== '.' && g[y][x] !== '_';
  return g.map((row, y) => row.map((ch, x) => (ch === '.' && (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1)) ? 'o' : ch === '_' ? '.' : ch)).join(''));
}

const FONT = {
  0: ['111', '101', '101', '101', '111'], 1: ['010', '110', '010', '010', '111'],

  E: ['111', '100', '111', '100', '111'], '.': ['0', '0', '0', '0', '1'],
  '+': ['000', '010', '111', '010', '000'], '-': ['000', '000', '111', '000', '000'],
  '!': ['1', '1', '1', '0', '1'], ' ': ['00', '00', '00', '00', '00'],

  P: ['111', '101', '111', '100', '100'], X: ['101', '101', '010', '101', '101'],
  L: ['100', '100', '100', '100', '111'], V: ['101', '101', '101', '101', '010'],
  S: ['111', '100', '111', '001', '111'], I: ['111', '010', '010', '010', '111'], U: ['101', '101', '101', '101', '111'],
  k: ['100', '101', '110', '101', '101'],
};
function textWidth(str, scale = 1) {
  let w = 0;
  for (const ch of str) w += ((FONT[ch] || FONT[' '])[0].length + 1) * scale;
  return w - scale;
}
function drawText(ctx, str, x, y, color, scale = 1, outline = OUTLINE) {
  const w = textWidth(str, scale);
  let cx = Math.round(x - w / 2);
  y = Math.round(y);
  for (const ch of str) {
    const g = FONT[ch] || FONT[' '];
    const gw = g[0].length;
    // outline pass
    ctx.fillStyle = outline;
    for (let r = 0; r < 5; r++) for (let c = 0; c < gw; c++) {
      if (g[r][c] !== '1') continue;
      ctx.fillRect(cx + (c - 1) * scale, y + (r - 1) * scale, scale * 3, scale * 3);
    }
    cx += (gw + 1) * scale;
  }
  cx = Math.round(x - w / 2);
  ctx.fillStyle = color;
  for (const ch of str) {
    const g = FONT[ch] || FONT[' '];
    const gw = g[0].length;
    for (let r = 0; r < 5; r++) for (let c = 0; c < gw; c++) {
      if (g[r][c] === '1') ctx.fillRect(cx + c * scale, y + r * scale, scale, scale);
    }
    cx += (gw + 1) * scale;
  }
}
