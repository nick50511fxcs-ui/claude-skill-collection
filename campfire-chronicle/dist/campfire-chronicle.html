const { sprite, drawRotated, drawText, icon, shade, OUTLINE, silhouette, HERO, HERO_STEP, HERO_CROUCH, HERO_HAND, HERO_PAL, CLONE_PAL, MON, MON_BASE_PAL, CROWN, ANIMALS, TOOLS, TOOL_PIVOT, TOOL_FOR, WOOD_PAL, BOW, WISP, WISP_PAL } = __m.sprites;
const { ITEMS, TIERS, MONSTERS, TOOL_TIERS, REGIONS, SPOTS } = __m.data;
const { toolTier, spotsUnlocked } = __m.engine;

const W = 384, H = 216, GROUND = 178;
// Duel positions: hero and monster face each other close up.
const HX = 162, MX = 224;
const GEAR_COLORS = ['#c8ccd8', '#9ae0a0', '#8ac8ff', '#d8a8ff', '#ffd27a', '#ff8aa8', '#bffcff'];

// Deterministic noise for terrain.
function noise(i, seed) {
  const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
  return x - Math.floor(x);
}
function smooth(x, seed) {
  const i = Math.floor(x), f = x - i;
  const a = noise(i, seed), b = noise(i + 1, seed);
  return a + (b - a) * (f * f * (3 - 2 * f));
}
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
const lerp = (a, b, t) => a + (b - a) * t;
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = lerp((pa >> 16) & 255, (pb >> 16) & 255, t), g = lerp((pa >> 8) & 255, (pb >> 8) & 255, t), bl = lerp(pa & 255, pb & 255, t);
  return `rgb(${r | 0},${g | 0},${bl | 0})`;
}

const THEMES = {
  meadow: { far: '#5a6a8a', mid: '#46704c', mid2: '#34583c', top: '#5a8a42', topD: '#3e6a32', dirt: '#6a4e34', dirtD: '#4a3424' },
  swamp: { far: '#4a4560', mid: '#3a4a40', mid2: '#2c3a30', top: '#4e6a3e', topD: '#3a5230', dirt: '#463a30', dirtD: '#2e261e' },
  ice: { far: '#465a80', mid: '#7090b0', mid2: '#56789c', top: '#c8dcea', topD: '#98b8d0', dirt: '#4a6080', dirtD: '#344660' },
  tower: { far: '#2e2440', mid: '#3a3050', mid2: '#26203a', top: '#6a5a90', topD: '#4a3e6a', dirt: '#2e2438', dirtD: '#1e1626' },
  camp: { far: '#5a6a8a', mid: '#46704c', mid2: '#34583c', top: '#5a8a42', topD: '#3e6a32', dirt: '#6a4e34', dirtD: '#4a3424' },
};

function skyColors(hour, theme) {
  if (theme === 'ice') return ['#1a2a4a', '#3a5a8a'];
  if (theme === 'tower') return ['#120a24', '#3a2458'];
  let top, bot;
  if (hour >= 20 || hour < 5) { top = '#0e1226'; bot = '#262a48'; }
  else if (hour < 7) { top = '#46507a'; bot = '#c8907a'; }
  else if (hour < 17) { top = '#4a76a8'; bot = '#a8c0d4'; }
  else { top = '#4a4268'; bot = '#c07a5e'; }
  if (theme === 'swamp') { top = mixHex(top, '#4a3a6a', 0.45); bot = mixHex(bot, '#8a9a7a', 0.45); }
  return [top, bot];
}

class Renderer {
  constructor(canvas, overlay, game) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.ov = overlay;
    this.g = game;
    this.t = 0;
    this.scroll = 0;
    this.floaters = [];
    this.parts = [];
    this.pops = [];
    this.shake = 0;
    this.flash = 0;
    this.flashColor = '#fff';
    this.timeScale = 1;
    this.fxQueue = [];
    this.fx = null;
    this.heroAnim = { swing: 0, hurt: 0, levelUp: 0, dodge: 0 };
    this.monAnim = { hurt: 0, dying: 0, last: null, atk: 0 };
    this.slotVis = [];
    this.layers = new Map();
    this.clones = [];
    this.soot = 0;
    this.lastMode = null;
    this.modeFade = 0;
    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.mini = null;
    this.nextMini = 10;
    this.wisp = null;
    this.nextWisp = 90 + Math.random() * 120;
    this.onNotice = () => {};
    this.makeOverlay();
  }

  makeOverlay() {
    this.ov.innerHTML = `
      <div class="nametag" id="nameTag"><span class="nm">모험가</span><span class="badge" id="titleBadge">새내기</span></div>
      <div class="monname" id="monName" hidden></div>
      <div class="bubble" id="bubble" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="bossbar" id="bossBar" hidden><div class="bb-name" id="bossName"></div><div class="bb-track"><i id="bossFill"></i></div></div>
      <div class="bosswarn" id="bossWarn" hidden></div>
      <div class="minihint" id="miniHint" hidden></div>
      <div class="blackout" id="blackout" hidden></div>`;
    this.el = {
      name: this.ov.querySelector('#nameTag'), title: this.ov.querySelector('#titleBadge'),
      mon: this.ov.querySelector('#monName'), bubble: this.ov.querySelector('#bubble'),
      banner: this.ov.querySelector('#banner'), blackout: this.ov.querySelector('#blackout'),
      bossBar: this.ov.querySelector('#bossBar'), bossName: this.ov.querySelector('#bossName'),
      bossFill: this.ov.querySelector('#bossFill'), bossWarn: this.ov.querySelector('#bossWarn'),
      miniHint: this.ov.querySelector('#miniHint'),
    };
  }

  // Position an overlay element at internal canvas coordinates.
  place(el, x, y) {
    el.style.left = (x / W) * 100 + '%';
    el.style.top = (y / H) * 100 + '%';
  }

  say(text, ms = 3500) {
    const b = this.el.bubble;
    b.textContent = text;
    b.hidden = false;
    clearTimeout(this.sayT);
    this.sayT = setTimeout(() => { b.hidden = true; }, ms);
  }

  // ---------- Event intake ----------
  handle(events) {
    const s = this.g.s;
    for (const e of events) {
      switch (e.t) {
        case 'hit':
          if (e.who === 'mon') {
            if (e.src !== 'tap') this.heroAnim.swing = 0.22;
            this.monAnim.hurt = 0.15;
            const big = e.src === 'strike';
            this.floater(fmtShort(e.dmg) + (e.crit || big ? '!' : ''), MX + rnd(-8, 8), 136 + rnd(-6, 4), big ? '#ff9a3a' : e.src === 'tap' ? '#bfe6ff' : e.crit ? '#ff6ad5' : '#fff2a8', big || e.crit ? 2 : 1);
            if (big && !this.reduced) { this.shake = Math.max(this.shake, 0.3); this.burst(MX, 150, '#ffb84a', 14); }
            if (e.src === 'tap' && !this.reduced) this.burst(MX + rnd(-6, 6), 160 + rnd(-10, 6), '#bfe6ff', 3);
            if (e.crit && !this.reduced) this.shake = Math.max(this.shake, 0.12);
          } else {
            this.heroAnim.hurt = 0.2;
            this.floater('-' + fmtShort(e.dmg) + (e.slam ? '!' : ''), HX + rnd(-4, 4), 132, '#ff5a5a', e.slam ? 2 : 1);
            this.monAnim.atk = 0.28;
            if (e.slam && !this.reduced) { this.shake = Math.max(this.shake, 0.35); this.flash = 0.12; this.flashColor = '#ff3a3a'; }
          }
          break;
        case 'miss': this.floater('MISS', HX, 130, '#a8d8ff', 1); this.monAnim.atk = 0.28; this.heroAnim.dodge = 0.3; break;
        case 'heal': this.ring(HX, 168, '#7affa0'); this.floater('+', HX, 128, '#7affa0', 2); break;
        case 'rage': this.ring(HX, 168, '#ff5a3a'); this.say('간다!!', 1500); break;
        case 'fever': this.flash = 0.25; this.flashColor = '#ffb84a'; this.say('열정 폭발! 모든 속도 ×2!', 2500); break;
        case 'spawn':
          if (e.mon.boss || e.mon.elite) this.bossIntro(e.mon);
          break;
        case 'kill':
          this.monAnim.dying = 0.35;
          this.monAnim.last = e.mon;
          this.burst(MX, 160, MON_BASE_PAL[MONSTERS[e.mon.key].sprite]?.a || '#fff', 10);
          this.floater('+' + fmtShort(e.gold) + 'g', MX, 124, '#ffd34d', 1);
          break;
        case 'lv':
          this.heroAnim.levelUp = 1.2;
          this.floater('LV UP', this.g.s.mode === 'camp' ? 157 : HX, 114, '#ffe066', 2);
          this.ring(this.g.s.mode === 'camp' ? 157 : HX, 168, '#ffe066');
          break;
        case 'drop':
          if (e.src === 'combat') this.pop(e.id, MX, 160);
          this.rareFx(e.id);
          break;
        case 'gear':
          if (e.equip) this.say('좋은 장비다! 바로 장착!', 2500);
          break;
        case 'act': {
          const v = this.vis(e.slot);
          v.last = this.t;
          v.kind = e.kind || 'ok';
          v.id = e.id;
          if (e.k === 'hunt') { v.arrow = 0.35; v.animal = null; }
          if (e.k === 'alchemy' && e.kind === 'fail' && e.slot === 0) this.soot = 3;
          if (e.slot === 0 && this.g.s.mode === 'camp') this.pop(e.id, 205, 160, e.n);
          else if (e.slot > 0) v.pop = { id: e.id, t: 0 };
          break;
        }
        case 'record': this.say(`신기록! ${ITEMS[e.id].name} ${e.w}kg!`, 3500); break;
        case 'camp': this.say(e.reason === 'death' ? '으윽… 모닥불로 후퇴!' : e.reason === 'tired' ? '헉헉, 잠깐 쉬자…' : '야영 준비!', 2500); break;
        case 'death': this.flash = 0.25; this.flashColor = '#ff3a3a'; break;
        case 'secret': this.queueFx({ tier: 5, id: 'x_secret', text: '미지의 레시피 발견!' }); break;
        case 'rebirth': this.queueFx({ tier: 4, id: 'p_luck', text: `윤회! 모닥불의 재 +${e.gain}` }); break;
      }
    }
  }

  bossIntro(mon) {
    const w = this.el.bossWarn;
    w.className = 'bosswarn' + (mon.boss ? ' boss' : ' elite');
    w.innerHTML = `<b>${mon.boss ? 'WARNING · BOSS' : '정예 몬스터'}</b><span>${mon.f}층 · ${mon.name}</span>`;
    w.hidden = false;
    w.style.animation = 'none';
    void w.offsetWidth;
    w.style.animation = '';
    clearTimeout(this.warnT);
    this.warnT = setTimeout(() => { w.hidden = true; }, mon.boss ? 2600 : 1800);
    if (mon.boss && !this.reduced) { this.shake = 0.45; this.flash = 0.2; this.flashColor = '#ff2a4a'; }
    this.say(mon.boss ? '저 녀석… 보통이 아니야!' : '조금 강해 보이는데?', 2400);
  }

  vis(i) {
    if (!this.slotVis[i]) this.slotVis[i] = { last: -9, kind: 'ok', id: null, arrow: 0, animal: null };
    return this.slotVis[i];
  }
  floater(text, x, y, color, scale) {
    this.floaters.push({ text, x, y, color, scale, t: 0, life: scale > 1 ? 1.1 : 0.9 });
    if (this.floaters.length > 40) this.floaters.shift();
  }
  burst(x, y, color, n) {
    if (this.reduced) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 50;
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, g: 120, life: 0.6, t: 0, color, size: 1 + (Math.random() < 0.3) });
    }
  }
  ring(x, y, color) {
    if (this.reduced) return;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      this.parts.push({ x, y, vx: Math.cos(a) * 40, vy: Math.sin(a) * 18 - 10, g: 0, life: 0.7, t: 0, color, size: 1 });
    }
  }
  pop(id, x, y, n = 1) {
    const it = ITEMS[id];
    if (!it) return;
    this.pops.push({ id, x, y, tx: this.g.s.mode === 'camp' ? 157 : HX, t: 0, n });
    if (this.pops.length > 12) this.pops.shift();
  }

  rareFx(id) {
    const it = ITEMS[id];
    if (!it || it.tier < 2) return;
    if (it.tier === 2) { this.sparkle(205, 150, TIERS[2].color); return; }
    this.queueFx({ tier: it.tier, id });
  }
  sparkle(x, y, color) {
    if (this.reduced) return;
    for (let i = 0; i < 8; i++) this.parts.push({ x: x + rnd(-10, 10), y: y + rnd(-10, 6), vx: 0, vy: -15, g: 0, life: 0.8, t: 0, color, size: 1, star: true });
  }
  queueFx(f) {
    if (this.fxQueue.length > 6) return;
    this.fxQueue.push(f);
  }
  // Replay big drops that happened while away (newest first, a few at most).
  replay(ids) {
    for (const id of ids.slice(-4)) this.queueFx({ tier: ITEMS[id].tier, id, replay: true });
  }

  startFx(f) {
    const it = ITEMS[f.id];
    const dur = [0, 0, 0, 1.4, 2.4, 3.2, 5][f.tier];
    this.fx = { ...f, t: 0, dur };
    const tier = TIERS[f.tier];
    const b = this.el.banner;
    const ic = icon(it.icon, it.color);
    const big = mk(ic.width * 4, ic.height * 4);
    const bctx = big.getContext('2d');
    bctx.imageSmoothingEnabled = false;
    bctx.drawImage(ic, 0, 0, big.width, big.height);
    const hall = this.g.s.hall.find(h => h.id === f.id);
    const extra = f.tier === 6 && hall ? `<small>${new Date(hall.at).toLocaleString('ko-KR')} · ${hall.n.toLocaleString()}번째 시도</small>` : '';
    b.className = 'banner tier' + f.tier;
    b.innerHTML = `<div class="bn-tier" style="color:${tier.color}">${f.replay ? '자리를 비운 사이 · ' : ''}${tier.name}</div>
      <div class="bn-body"><span class="bn-icon"></span><span class="bn-name">${f.text || it.name}</span></div>${extra}`;
    b.querySelector('.bn-icon').appendChild(big);
    b.hidden = true;
    if (f.tier >= 4) { this.shake = this.reduced ? 0 : 0.5; this.flash = 0.2; this.flashColor = tier.color; }
    if (f.tier === 5 && !this.reduced) this.timeScale = 0.3;
    if (f.tier === 6) { this.el.blackout.hidden = false; this.el.blackout.className = 'blackout on'; }
    else this.showBanner();
  }
  showBanner() {
    const b = this.el.banner;
    b.hidden = false;
    b.style.animation = 'none';
    void b.offsetWidth;
    b.style.animation = '';
  }
  updateFx(dt) {
    if (!this.fx && this.fxQueue.length) this.startFx(this.fxQueue.shift());
    const f = this.fx;
    if (!f) return;
    f.t += dt;
    if (f.tier === 5 && f.t > 1) this.timeScale = 1;
    if (f.tier === 6 && f.t > 1.6 && !f.revealed) {
      f.revealed = true;
      this.el.blackout.className = 'blackout reveal';
      this.flash = 0.4;
      this.flashColor = '#ffffff';
      this.showBanner();
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 90;
        this.parts.push({ x: W / 2, y: H / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0, life: 1.4, t: 0, color: `hsl(${(i * 37) % 360} 100% 70%)`, size: 2 });
      }
    }
    if (f.t >= f.dur) {
      this.fx = null;
      this.timeScale = 1;
      this.el.banner.hidden = true;
      this.el.blackout.hidden = true;
    }
  }

  // ---------- Background ----------
  layer(theme, hour) {
    const bucket = theme === 'ice' || theme === 'tower' ? 0 : hour >= 20 || hour < 5 ? 1 : hour < 7 ? 2 : hour < 17 ? 3 : 4;
    const key = theme + bucket;
    if (this.layers.has(key)) return this.layers.get(key);
    const T = THEMES[theme];
    const seed = theme.length * 7 + 3;
    // Sky + far mountains (static)
    const sky = mk(W, H);
    const sc = sky.getContext('2d');
    const [top, bot] = skyColors(hour, theme);
    const grd = sc.createLinearGradient(0, 0, 0, GROUND);
    grd.addColorStop(0, top);
    grd.addColorStop(1, bot);
    sc.fillStyle = grd;
    sc.fillRect(0, 0, W, H);
    if (bucket === 1 || theme === 'tower' || theme === 'ice') {
      for (let i = 0; i < 70; i++) {
        sc.fillStyle = noise(i, 3) > 0.8 ? '#ffffff' : '#a8b8ff';
        sc.fillRect(Math.floor(noise(i, 1) * W), Math.floor(noise(i, 2) * 120), 1, 1);
      }
    }
    if (theme === 'ice') {
      // Cave ceiling with icicles
      sc.fillStyle = '#24365a';
      for (let x = 0; x < W; x++) {
        const h = 10 + Math.floor(smooth(x / 9, 5) * 16 + (noise(x, 8) > 0.86 ? 14 : 0));
        sc.fillRect(x, 0, 1, h);
      }
    }
    // Far: wide wrap-around layer (2x width)
    const far = mk(W * 2, H);
    const fc = far.getContext('2d');
    const farCol = bucket === 1 ? shade(T.far, -0.45) : T.far;
    for (let x = 0; x < W * 2; x++) {
      const u = (x / (W * 2)) * 16;
      const h = 60 + smooth(u, seed) * 50 + smooth(u * 3, seed + 1) * 14;
      fc.fillStyle = farCol;
      fc.fillRect(x, GROUND - h, 1, h);
      if (theme === 'ice' || theme === 'meadow') {
        fc.fillStyle = shade(farCol, 0.35);
        fc.fillRect(x, GROUND - h, 1, 2);
      }
    }
    // Mid: hills + decorations + a floating ledge with a rope
    const mid = mk(W * 2, H);
    const mc = mid.getContext('2d');
    const midCol = bucket === 1 ? shade(T.mid, -0.45) : T.mid;
    const mid2 = bucket === 1 ? shade(T.mid2, -0.45) : T.mid2;
    for (let x = 0; x < W * 2; x++) {
      const u = (x / (W * 2)) * 10;
      const h = 22 + smooth(u, seed + 9) * 28;
      mc.fillStyle = midCol;
      mc.fillRect(x, GROUND - h, 1, h);
    }
    for (let i = 0; i < 9; i++) {
      const x = Math.floor(noise(i, seed + 4) * (W * 2 - 30)) + 10;
      this.decor(mc, theme, x, GROUND - 6 - Math.floor(noise(i, 9) * 14), mid2, i);
    }
    // Ledge
    const lx = Math.floor(W * 0.62), ly = 112;
    mc.fillStyle = shade(T.dirt, bucket === 1 ? -0.5 : -0.15);
    mc.fillRect(lx, ly, 86, 10);
    mc.fillStyle = bucket === 1 ? shade(T.top, -0.5) : T.top;
    mc.fillRect(lx, ly, 86, 3);
    mc.fillStyle = OUTLINE;
    mc.fillRect(lx, ly + 10, 86, 1);
    mc.fillStyle = '#c8a86a';
    for (let y = ly + 10; y < GROUND - 2; y += 3) mc.fillRect(lx + 70, y, 1, 2);
    mc.fillStyle = '#5ab45a';
    mc.fillRect(lx + 69, GROUND - 6, 3, 3);
    // Ground strip (tileable)
    const gr = mk(W * 2, H - GROUND);
    const gc = gr.getContext('2d');
    gc.fillStyle = T.dirt;
    gc.fillRect(0, 0, W * 2, H - GROUND);
    for (let i = 0; i < 300; i++) {
      gc.fillStyle = noise(i, 11) > 0.5 ? T.dirtD : shade(T.dirt, 0.15);
      gc.fillRect(Math.floor(noise(i, 12) * W * 2), 6 + Math.floor(noise(i, 13) * (H - GROUND - 6)), 2, 1);
    }
    gc.fillStyle = T.top;
    gc.fillRect(0, 0, W * 2, 4);
    gc.fillStyle = T.topD;
    for (let x = 0; x < W * 2; x += 3) gc.fillRect(x, 4, 2, 1 + (noise(x, 14) > 0.5));
    gc.fillStyle = OUTLINE;
    gc.fillRect(0, 0, W * 2, 1);
    for (let x = 0; x < W * 2; x += 7) if (noise(x, 15) > 0.6) { gc.fillStyle = shade(T.top, 0.25); gc.fillRect(x, 1, 1, 1); }
    const L = { sky, far, mid, ground: gr };
    this.layers.set(key, L);
    return L;
  }

  decor(c, theme, x, y, col, i) {
    c.fillStyle = col;
    if (theme === 'meadow' || theme === 'camp') {
      c.fillStyle = shade(col, -0.25);
      c.fillRect(x + 6, y - 2, 3, 10);
      c.fillStyle = col;
      for (let r = 0; r < 3; r++) circle(c, x + 4 + r * 3, y - 6 - (r % 2) * 3, 6);
    } else if (theme === 'swamp') {
      c.fillRect(x + 5, y - 22, 2, 30);
      c.fillRect(x + 1, y - 16, 5, 2);
      c.fillRect(x + 6, y - 12, 6, 2);
      c.fillRect(x + 1, y - 18, 2, 3);
    } else if (theme === 'ice') {
      for (let k = 0; k < 4; k++) c.fillRect(x + k * 2, y - k * 4, 3, k * 4 + 8);
      c.fillStyle = shade(col, 0.4);
      c.fillRect(x + 2, y - 8, 1, 10);
    } else {
      c.fillRect(x, y - 40, 10, 48);
      c.fillStyle = shade(col, 0.25);
      c.fillRect(x - 2, y - 42, 14, 4);
      c.fillRect(x + 2, y - 30 + (i % 3) * 6, 2, 3);
    }
  }

  location(k, spot, hour) {
    const indoor = isIndoor(k, spot);
    const key = `loc:${k}:${spot}:${indoor ? 0 : skyBucket(hour)}`;
    if (this.layers.has(key)) return this.layers.get(key);
    const c = mk(W, H);
    const x = c.getContext('2d');
    LOCS[k](x, spot, hour);
    this.layers.set(key, c);
    return c;
  }
  campSpot(k) {
    const s = this.g.s;
    return SPOTS[k] ? Math.min(s.spots[k] || 0, spotsUnlocked(s.skills[k].lv) - 1) : 0;
  }

  drawBackground(ctx, theme, hour, scroll) {
    const L = this.layer(theme, hour);
    ctx.drawImage(L.sky, 0, 0);
    const fx = -((scroll * 0.15) % (W * 2));
    ctx.drawImage(L.far, fx, 0);
    ctx.drawImage(L.far, fx + W * 2, 0);
    const mx = -((scroll * 0.45) % (W * 2));
    ctx.drawImage(L.mid, mx, 0);
    ctx.drawImage(L.mid, mx + W * 2, 0);
    const gx = -(scroll % (W * 2));
    ctx.drawImage(L.ground, gx, GROUND);
    ctx.drawImage(L.ground, gx + W * 2, GROUND);
  }

  weather(ctx, env, theme, w = W, h = H) {
    if (this.reduced || theme === 'indoor') return;
    const t = this.t;
    if (theme === 'swamp') {
      ctx.fillStyle = 'rgba(190,170,230,0.10)';
      for (let i = 0; i < 4; i++) ctx.fillRect(0, 120 + i * 14 + Math.sin(t * 0.6 + i) * 4, w, 8);
      for (let i = 0; i < 10; i++) {
        const fx = (noise(i, 31) * w + t * 6 * (i % 2 ? 1 : -1)) % w;
        ctx.fillStyle = Math.sin(t * 3 + i) > 0 ? '#d8ff6a' : '#8aa848';
        ctx.fillRect((fx + w) % w, 100 + noise(i, 32) * 70 + Math.sin(t + i) * 5, 1, 1);
      }
    }
    if (theme === 'ice' || env.weather === 'snow') {
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 40; i++) {
        const x = (noise(i, 21) * w + Math.sin(t + i) * 6 + t * 4) % w;
        const y = (noise(i, 22) * h + t * (10 + (i % 5) * 3)) % h;
        ctx.fillRect(x, y, 1, 1);
      }
    } else if (env.weather === 'rain' && theme !== 'tower') {
      ctx.fillStyle = 'rgba(170,200,255,0.65)';
      for (let i = 0; i < 50; i++) {
        const x = (noise(i, 23) * w - t * 60) % w;
        const y = (noise(i, 24) * h + t * 160) % h;
        ctx.fillRect((x + w) % w, y, 1, 3);
      }
    }
  }

  // ---------- Actors ----------
  drawHero(ctx, x, y, opts = {}) {
    const pal = opts.pal || HERO_PAL;
    const step = opts.walk && Math.sin(this.t * 10) > 0;
    const body = opts.crouch ? sprite('heroc', HERO_CROUCH, pal) : step ? sprite('heros', HERO_STEP, pal) : sprite('hero', HERO, pal);
    const x0 = x - 11;
    const bob = opts.walk ? Math.round(Math.abs(Math.sin(this.t * 10))) : Math.round(Math.sin(this.t * 2.5) * 0.5 + 0.5);
    const top = y - body.height - bob;
    if (opts.shadow !== false) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x - 8, y - 1, 17, 2);
    }
    ctx.drawImage(body, x0, top);
    if (opts.hurt > 0) {
      ctx.globalAlpha = 0.65;
      ctx.drawImage(silhouette(body, '#ff4a4a'), x0, top);
      ctx.globalAlpha = 1;
    }
    if (opts.soot) {
      ctx.fillStyle = 'rgba(40,30,30,0.7)';
      ctx.fillRect(x0 + 12, top + 11, 5, 2);
      ctx.fillRect(x0 + 7, top + 14, 3, 2);
      ctx.fillRect(x0 + 15, top + 15, 2, 1);
    }
    return { hx: x0 + HERO_HAND[0], hy: top + HERO_HAND[1] };
  }

  drawTool(ctx, kind, hand, angle, color, flip = false) {
    if (kind === 'bow') return;
    const img = sprite('tool:' + kind, TOOLS[kind], { ...WOOD_PAL, a: color });
    const [px, py] = TOOL_PIVOT[kind];
    drawRotated(ctx, img, hand.hx, hand.hy, px, py, angle, flip);
    ctx.fillStyle = OUTLINE;
    ctx.fillRect(hand.hx - 1, hand.hy - 1, 3, 3);
    ctx.fillStyle = HERO_PAL.s;
    ctx.fillRect(hand.hx, hand.hy, 1, 1);
  }

  drawMonster(ctx, mon, x, y, alpha = 1) {
    const M = MONSTERS[mon.key];
    let key = M.sprite;
    if (key === 'bat' && Math.sin(this.t * 14) > 0) key = 'bat2';
    const pal = { ...MON_BASE_PAL[key], ...M.pal };
    if (mon.variant === 'golden') { pal.a = '#ffd34d'; pal.r = '#ffd34d'; }
    if (mon.variant === 'ancient') { pal.a = '#3a2a4a'; pal.r = '#3a2a4a'; pal.e = '#ff3a3a'; }
    const region = this.g.region(mon.f);
    if (region.theme === 'tower' && !mon.variant) { pal.a = shade(pal.a || '#888', -0.45); if (pal.r) pal.r = shade(pal.r, -0.45); }
    const img = sprite('mon:' + key, MON[key], pal);
    // Drawn at native size so every sprite shares one pixel grid; bosses have their own big sprites.
    const scale = mon.variant === 'giant' || mon.variant === 'ancient' ? 2 : 1;
    const w = img.width * scale, h = img.height * scale;
    const fly = M.fly ? 26 + Math.sin(this.t * 3) * 4 : 0;
    const squash = key === 'slime' ? Math.sin(this.t * 6) * 0.08 : 0;
    const hh = h * (1 - squash);
    const top = y - hh - fly;
    ctx.globalAlpha = alpha;
    if (mon.variant === 'ancient' && !this.reduced) {
      ctx.fillStyle = 'rgba(255,58,90,0.25)';
      circle(ctx, x, top + hh / 2, w * 0.75 + Math.sin(this.t * 5) * 2);
    }
    if (mon.variant === 'golden' && Math.random() < 0.3 && !this.reduced) this.sparkle(x, top + hh / 2, '#ffe066');
    if ((mon.boss || mon.elite) && !this.reduced) {
      ctx.globalAlpha = 0.18 + 0.08 * Math.sin(this.t * 4);
      ctx.fillStyle = mon.boss ? '#ff2a4a' : '#ffb84a';
      circle(ctx, x, top + hh / 2, Math.max(w, hh) * 0.62);
      ctx.globalAlpha = alpha;
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x - w / 2 + 2, y - 1, w - 4, 2);
    ctx.drawImage(img, Math.round(x - w / 2), Math.round(top), w, Math.round(hh));
    if (this.monAnim.hurt > 0 && alpha > 0) {
      ctx.globalAlpha = 0.7 * alpha;
      ctx.drawImage(silhouette(img, '#ffffff'), Math.round(x - w / 2), Math.round(top), w, Math.round(hh));
      ctx.globalAlpha = alpha;
    }
    if ((M.crown && mon.boss) || mon.elite) {
      const cr = sprite('crown', CROWN, { y: mon.elite ? '#c8ccd8' : '#ffd34d', r: '#ff3a5a' });
      ctx.drawImage(cr, Math.round(x - cr.width / 2), Math.round(top - cr.height + 3));
    }
    ctx.globalAlpha = 1;
    return { top, w };
  }

  // ---------- Life-skill stations ----------
  // Draws the actor working at a station. hx = actor x, gy = ground y.
  drawStation(ctx, k, hx, gy, slot, opts = {}) {
    const s = this.g.s;
    const v = this.vis(slot);
    const t = this.t;
    const since = t - v.last;
    const sl = s.slots[slot];
    const p = sl ? sl.p : 0;
    const lv = s.skills[k].lv;
    const tc = TOOL_TIERS[toolTier(lv)].color;
    const pal = opts.pal;
    const nx = hx + 24;
    const hit = since < 0.25;
    const fx = !opts.mini && !this.reduced;
    const spot = SPOTS[k] ? Math.min(s.spots[k] || 0, spotsUnlocked(lv) - 1) : 0;
    switch (k) {
      case 'mining': {
        rock(ctx, nx + (hit ? rnd(-1, 1) : 0), gy, spot, hit, t);
        const hand = this.drawHero(ctx, hx, gy, { pal });
        this.drawTool(ctx, 'pick', hand, swingAngle(p), tc);
        if (hit && since < 0.05 && fx) this.burst(nx - 6, gy - 10, ROCK_ORE[spot], 5 + spot * 2);
        break;
      }
      case 'wood': {
        const shake = hit ? Math.sin(since * 60) * 2 : 0;
        tree(ctx, nx + 6, gy, shake, spot, t);
        const hand = this.drawHero(ctx, hx, gy, { pal });
        this.drawTool(ctx, 'axe', hand, swingAngle(p) * 0.9 + 0.3, tc);
        if (hit && since < 0.05 && fx) this.burst(nx + 2, gy - 20, TREES[spot].leaf, 4 + spot * 2);
        break;
      }
      case 'forage': {
        bush(ctx, nx - 2, gy, spot, hit, t, false);
        const hand = this.drawHero(ctx, hx, gy, { pal, crouch: true });
        this.drawTool(ctx, 'sickle', hand, 1.2 + Math.sin(p * Math.PI * 2) * 0.5, tc);
        if (hit && since < 0.05 && fx) this.burst(nx - 4, gy - 6, BUSH_SPARK[spot], 4 + spot * 2);
        break;
      }
      case 'fish': {
        water(ctx, hx + 14, gy, opts.w || W, t, spot);
        const hand = this.drawHero(ctx, hx, gy, { pal });
        const bite = p > 0.8;
        const ang = hit ? -0.2 : 0.75 + (bite ? Math.sin(t * 30) * 0.06 : 0);
        this.drawTool(ctx, 'rod', hand, ang, tc);
        const tipX = hand.hx + Math.sin(ang) * 11, tipY = hand.hy - Math.cos(ang) * 11;
        const bx = hx + 52, by = gy + 4 + (bite ? Math.round(Math.sin(t * 25)) * 2 : Math.round(Math.sin(t * 2)));
        if (!hit) {
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          line(ctx, tipX, tipY, bx, by);
          ctx.fillStyle = spot === 4 ? '#7affe8' : '#ff3a3a';
          ctx.fillRect(bx - 1, by - 2, 3, 2);
          ctx.fillStyle = '#fff';
          ctx.fillRect(bx - 1, by, 3, 1);
          if (lv >= 250 && bite) { ctx.fillStyle = 'rgba(255,220,90,0.45)'; ctx.fillRect(bx - 6, by + 4, 12, 3); }
        } else if (since < 0.05 && fx) this.burst(bx, gy + 4, spot === 4 ? '#7affe8' : '#bfe6ff', 6 + spot * 2);
        break;
      }
      case 'hunt': {
        const kind = ANIMAL_BY_SPOT[spot];
        if (!v.animal || v.animal.kind !== kind) v.animal = { kind };
        huntGround(ctx, hx, gy, opts.w || W, spot, t);
        const ax = lerp((opts.w || W) + 10, hx + 70, Math.min(1, p / 0.6));
        const animal = sprite('an:' + kind, ANIMALS[kind], ANIMAL_PAL[kind]);
        if (!hit) {
          if (spot === 4) { ctx.globalAlpha = 0.25 + 0.1 * Math.sin(t * 4); ctx.fillStyle = '#ffe8ff'; circle(ctx, ax + animal.width / 2, gy - animal.height / 2, animal.width * 0.7); ctx.globalAlpha = 1; }
          ctx.save();
          ctx.translate(Math.round(ax + animal.width / 2), 0);
          ctx.scale(-1, 1);
          ctx.drawImage(animal, -Math.round(animal.width / 2), gy - animal.height);
          ctx.restore();
        } else if (since < 0.05 && fx) this.burst(hx + 72, gy - 6, ANIMAL_PAL[kind].a, 6 + spot * 2);
        const hand = this.drawHero(ctx, hx, gy, { pal, crouch: true });
        const draw = p > 0.6 ? Math.min(1, (p - 0.6) / 0.35) : 0;
        const bow = sprite('bow', BOW, { a: tc });
        const bx = hand.hx - 2, by = hand.hy - 12, ay = by + 6;
        ctx.drawImage(bow, bx, by);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(bx + 1 - Math.round(draw * 3), by + 1, 1, 11);
        if (draw > 0 && !hit) { ctx.fillStyle = '#c8a86a'; ctx.fillRect(bx - 2 - Math.round(draw * 3), ay, 10, 1); }
        if (since < 0.3) {
          const ax2 = lerp(bx + 7, hx + 72, Math.min(1, since / 0.18));
          ctx.fillStyle = '#c8a86a';
          ctx.fillRect(ax2, ay, 8, 1);
          ctx.fillStyle = '#fff';
          ctx.fillRect(ax2 + 7, ay - 1, 2, 3);
        }
        bush(ctx, hx + 10, gy, 0, false, t, true);
        break;
      }
      case 'alchemy': {
        const r = s.recipe;
        const liquid = v.kind === 'fail' && since < 1.2 ? '#4a4a4a' : ITEMS[r] ? ITEMS[r].color : '#7ad8ff';
        cauldron(ctx, nx + 2, gy, liquid, t, (v.kind === 'great' || v.kind === 'miracle') && since < 1.5, toolTier(lv));
        const hand = this.drawHero(ctx, hx, gy, { pal, soot: slot === 0 && this.soot > 0 });
        this.drawTool(ctx, 'ladle', hand, 1.4 + Math.sin(t * 4) * 0.35, tc);
        if (v.kind === 'fail' && since < 0.05 && fx) {
          for (let i = 0; i < 14; i++) this.parts.push({ x: nx + 2, y: gy - 16, vx: rnd(-40, 40), vy: rnd(-70, -20), g: 30, life: 1, t: 0, color: '#6a6a6a', size: 3 });
        }
        if (sl && sl.blocked && Math.sin(t * 4) > 0) drawText(ctx, '!', nx + 2, gy - 34, '#ff5a5a', 2);
        break;
      }
    }
  }

  // ---------- Active play: chance events at the station, the wisp, clicks ----------
  click(x, y) {
    const g = this.g;
    if (this.wisp) {
      const w = this.wisp;
      if (Math.hypot(x - w.x, y - w.y) < 16) {
        const text = g.claimWisp();
        this.burst(w.x, w.y, '#fff6b0', 16);
        this.ring(w.x, w.y, '#ffe066');
        this.onNotice(`떠돌이 요정을 잡았다! ${text}`, 4);
        this.wisp = null;
        return;
      }
    }
    if (this.mini && this.mini.click(x, y)) return;
    if (g.s.mode === 'fight' && g.mon && Math.abs(x - MX) < 30 && y > GROUND - 70 && y < GROUND + 6) g.tap();
  }

  miniDone(text, good) {
    this.el.miniHint.hidden = true;
    this.mini = null;
    this.nextMini = 18 + Math.random() * 17;
    if (text) this.floater(good ? '+' : '-', 157, 120, good ? '#ffe066' : '#a8a8b8', 2);
    if (text) this.onNotice(text, good ? 3 : 0);
  }
  hint(text, x, y) {
    const h = this.el.miniHint;
    h.textContent = text;
    h.hidden = false;
    this.place(h, x, y);
  }
  spawnMini(k) {
    const g = this.g, self = this, nx = 181;
    const ok = (n, boost, text) => { g.lifeBurst(k, n, boost); self.burst(nx, GROUND - 14, '#ffe066', 16); self.miniDone(text, true); };
    let m;
    if (k === 'mining') {
      const tx = nx + rnd(-7, 7), ty = GROUND - 9 + rnd(-4, 2);
      m = { life: 3.5, hint: '빛나는 약점을 클릭!', hx: nx, hy: GROUND - 34,
        draw(ctx, t) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 12); ctx.fillStyle = '#fff6b0'; circle(ctx, tx, ty, 4); ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff'; ctx.fillRect(tx - 3, ty, 7, 1); ctx.fillRect(tx, ty - 3, 1, 7); ctx.strokeStyle = '#ffe066'; ctx.beginPath(); ctx.arc(tx + 0.5, ty + 0.5, 9 - (t % 0.6) * 8, 0, 6.3); ctx.stroke(); },
        click(x, y) { if (Math.hypot(x - tx, y - ty) < 11) { ok(5, 3, '약점 적중! 광석 ×5, 희귀 확률 ×3'); return true; } return false; } };
    } else if (k === 'wood') {
      m = { life: 4.5, hint: '표시가 초록 칸에 올 때 클릭!', hx: 200, hy: 92, pos: 0,
        draw(ctx, t) { this.pos = 0.5 + 0.5 * Math.sin(t * 4.2); ctx.fillStyle = OUTLINE; ctx.fillRect(159, 99, 82, 8); ctx.fillStyle = '#3a2a2a'; ctx.fillRect(160, 100, 80, 6); ctx.fillStyle = '#5ab45a'; ctx.fillRect(160 + 80 * 0.32, 100, 80 * 0.36, 6); ctx.fillStyle = '#ffe066'; ctx.fillRect(160 + 80 * 0.42, 100, 80 * 0.16, 6); ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(160 + 80 * this.pos) - 1, 97, 3, 12); },
        click() { const d = Math.abs(this.pos - 0.5); if (d < 0.08) ok(6, 3, '완벽한 일격! 원목 ×6, 희귀 확률 ×3'); else if (d < 0.18) ok(3, 1.5, '좋은 일격! 원목 ×3'); else self.miniDone('빗나갔다… 다음 기회에!', false); return true; } };
    } else if (k === 'fish') {
      const bite = 1 + Math.random() * 2.5;
      m = { life: bite + 1.4, hint: '찌가 크게 흔들리면 클릭!', hx: 209, hy: GROUND - 20,
        draw(ctx, t) { if (t > bite) { if (Math.sin(t * 30) > 0) drawText(ctx, '!', 209, GROUND - 26, '#ff5a5a', 3); this.hintNow = '지금!'; } },
        click() { const r = self.mini.t - bite; if (r < 0) self.miniDone('너무 일렀다! 물고기가 도망갔다', false); else if (r < 0.45) ok(6, 3, '완벽한 챔질! 물고기 ×6, 희귀 확률 ×3'); else ok(3, 1.5, '챔질 성공! 물고기 ×3'); return true; } };
    } else if (k === 'forage') {
      const spots = [0, 1, 2].map(() => ({ x: 60 + Math.random() * 280, y: 120 + Math.random() * 50, hit: false }));
      m = { life: 6, hint: '반짝이는 약초 3개를 클릭!', hx: 200, hy: 112, found: 0,
        draw(ctx, t) { for (const p of spots) if (!p.hit) { ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 8 + p.x); ctx.fillStyle = '#d8ff8a'; circle(ctx, p.x, p.y, 5); ctx.globalAlpha = 1; sparkle(ctx, p.x, p.y, t * 3, p.x, '#ffffff'); ctx.fillStyle = '#7ad85a'; ctx.fillRect(p.x - 1, p.y - 1, 3, 3); } },
        click(x, y) { const p = spots.find(q => !q.hit && Math.hypot(x - q.x, y - q.y) < 11); if (!p) return false; p.hit = true; g.lifeBurst('forage', 2, 2); self.burst(p.x, p.y, '#d8ff8a', 8); this.found++; if (this.found === 3) self.miniDone('약초를 모두 찾았다! 채집물 ×6', true); return true; } };
    } else if (k === 'hunt') {
      m = { life: 3.2, hint: '달리는 사냥감을 클릭!', hx: 200, hy: 120, x: 400,
        draw(ctx, t) { this.x = 400 - t * 95; const img = sprite('an:deer', ANIMALS.deer, { a: '#ffd34d', y: '#fff6b0', r: '#ff9aa8' }); ctx.globalAlpha = 0.3; ctx.fillStyle = '#ffe066'; circle(ctx, this.x, GROUND - img.height / 2, img.width * 0.6); ctx.globalAlpha = 1; ctx.save(); ctx.translate(Math.round(this.x), 0); ctx.scale(-1, 1); ctx.drawImage(img, -Math.round(img.width / 2), GROUND - img.height + Math.round(Math.abs(Math.sin(t * 14)) * -2)); ctx.restore(); },
        click(x, y) { if (Math.abs(x - this.x) < 16 && y > GROUND - 34) { ok(5, 3, '명중! 사냥감 ×5, 희귀 확률 ×3'); return true; } return false; } };
    } else if (k === 'alchemy') {
      m = { life: 5, hint: '거품이 가장 높을 때 클릭!', hx: 183, hy: GROUND - 44, v: 0,
        draw(ctx, t) { this.v = (Math.sin(t * 2.4 - Math.PI / 2) + 1) / 2; ctx.fillStyle = OUTLINE; ctx.fillRect(205, GROUND - 46, 6, 40); ctx.fillStyle = '#2a2a3a'; ctx.fillRect(206, GROUND - 45, 4, 38); ctx.fillStyle = this.v > 0.85 ? '#ffe066' : '#7affe8'; const h = Math.round(38 * this.v); ctx.fillRect(206, GROUND - 7 - h, 4, h); ctx.fillStyle = '#ffe066'; ctx.fillRect(204, GROUND - 40, 8, 1); },
        click() { if (this.v > 0.85) ok(3, 1, '완벽한 젓기! 다음 3번 대성공 확정'); else self.miniDone('타이밍이 아쉬워요', false); return true; } };
    }
    if (m) { m.t = 0; this.mini = m; this.mini.k = k; this.hint(m.hint, m.hx, m.hy); this.onNotice(null, 0, 'mini'); }
  }
  updateActive(ctx, dt, camp) {
    const g = this.g;
    // Chance events only at the main station, and only while someone is watching (live).
    if (camp) {
      const k = g.s.slots[0].k;
      if (this.mini && this.mini.k !== k) { this.el.miniHint.hidden = true; this.mini = null; }
      if (!this.mini) { this.nextMini -= dt; if (this.nextMini <= 0) this.spawnMini(k); }
      if (this.mini) {
        this.mini.t += dt;
        this.mini.draw(ctx, this.mini.t);
        if (this.mini && this.mini.hintNow) this.hint(this.mini.hintNow, this.mini.hx, this.mini.hy);
        if (this.mini && this.mini.t > this.mini.life) this.miniDone(null, false);
      }
    } else if (this.mini) { this.el.miniHint.hidden = true; this.mini = null; this.nextMini = 8; }
    // Wandering wisp: crosses the sky every few minutes; click it for a gift.
    this.nextWisp -= dt;
    if (!this.wisp && this.nextWisp <= 0) { this.wisp = { t: 0, x: -10, y: 70 }; this.nextWisp = 150 + Math.random() * 180; }
    if (this.wisp) {
      const w = this.wisp;
      w.t += dt;
      w.x = -10 + w.t * 32;
      w.y = 70 + Math.sin(w.t * 1.7) * 24;
      ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff6b0'; circle(ctx, w.x, w.y, 9); ctx.globalAlpha = 1;
      const fr = Math.sin(this.t * 25) > 0 ? 1 : 0;
      const img = sprite('wisp' + fr, WISP[fr], WISP_PAL);
      ctx.drawImage(img, Math.round(w.x - img.width / 2), Math.round(w.y - img.height / 2));
      if (!this.reduced && Math.random() < 0.5) this.parts.push({ x: w.x, y: w.y, vx: -6, vy: 4, g: 0, life: 0.8, t: 0, color: '#fff6b0', size: 1 });
      if (w.x > W + 12) this.wisp = null;
    }
  }

  // ---------- Frame ----------
  frame(dtReal) {
    const dt = dtReal * this.timeScale;
    this.t += dt;
    const ctx = this.ctx;
    const g = this.g, s = g.s, c = s.char;
    ctx.imageSmoothingEnabled = false;
    if (this.lastMode !== s.mode) { this.modeFade = 0.35; this.lastMode = s.mode; }
    const env = g.env;
    const region = g.region(c.floor);
    const camp = s.mode === 'camp';
    const campK = s.slots[0].k, campSp = this.campSpot(campK);
    const theme = camp ? (isIndoor(campK, campSp) ? 'indoor' : 'camp') : region.theme;
    const mon = g.mon;
    const walking = !camp && (!mon || mon.approach > 0);
    if (walking && !this.reduced) this.scroll += dt * 40;

    ctx.save();
    if (this.shake > 0) ctx.translate(Math.round(rnd(-2, 2)), Math.round(rnd(-2, 2)));
    if (camp) ctx.drawImage(this.location(campK, campSp, env.hour), 0, 0);
    else this.drawBackground(ctx, theme, env.hour, this.scroll);

  // Background monsters of the current region that wander around (decoration only).

  drawFight(ctx, mon, walking) {

    ctx.fillStyle = '#1a3a1a';
    ctx.fillRect(HX - hb / 2, GROUND - 38, hb, 2);
    ctx.fillStyle = hf > 0.3 ? '#6ac05a' : '#d84a4a';

  drawCamp(ctx, env) {

  drawPops(ctx, dt) {
    for (const p of this.pops) {
      p.t += dt;
      const f = Math.min(1, p.t / 0.7);

      const it = ITEMS[p.id];

      if (it.tier >= 1) {
        const a = ctx.globalAlpha;
        ctx.globalAlpha = a * (0.25 + 0.1 * it.tier);
        ctx.fillStyle = TIERS[it.tier].color;
        circle(ctx, Math.round(x), Math.round(y - 6), 6 + it.tier * 2);
        ctx.globalAlpha = a;
      }
      ctx.drawImage(icon(it.icon, it.color), Math.round(x - 6), Math.round(y - 12));

        ctx.fillStyle = TIERS[it.tier].color;

      }
      ctx.globalAlpha = 1;
    }
    this.pops = this.pops.filter(p => p.t < 0.9);
  }
  drawParts(ctx, dt) {
    for (const p of this.parts) {
      p.t += dt;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.color;
      if (p.star) { ctx.fillRect(Math.round(p.x), Math.round(p.y) - 1, 1, 3); ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y), 3, 1); }
      else ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    ctx.globalAlpha = 1;
    this.parts = this.parts.filter(p => p.t < p.life);
    if (this.parts.length > 400) this.parts.splice(0, this.parts.length - 400);
  }
  drawFloaters(ctx, dt) {
    for (const f of this.floaters) {
      f.t += dt;
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, f.t - f.life * 0.6) / (f.life * 0.4));
      drawText(ctx, f.text, f.x, f.y - f.t * 22, f.color, f.scale);
    }
    ctx.globalAlpha = 1;
    this.floaters = this.floaters.filter(f => f.t < f.life);
  }

  // Small canvases showing clones working at their own stations.
  setCloneCanvases(list) { this.clones = list; }
  renderClones() {
    const s = this.g.s;
    this.clones.forEach((cv, i) => {
      const slot = i + 1;
      if (!s.slots[slot]) return;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      const w = cv.width, h = cv.height, gy = h - 14;
      const k = s.slots[slot].k;
      // The clone works at its own place: crop that location around the station.
      ctx.drawImage(this.location(k, this.campSpot(k), this.g.env.hour), 157 - 40, GROUND - gy, w, h, 0, 0, w, h);
      this.drawStation(ctx, k, 40, gy, slot, { pal: CLONE_PAL, w, mini: true });
      const v = this.vis(slot);
      if (v.pop) {
        v.pop.t += 1 / 60;
        const it = ITEMS[v.pop.id];
        if (it && v.pop.t < 0.8) {
          ctx.globalAlpha = 1 - v.pop.t / 0.8;
          ctx.drawImage(icon(it.icon, it.color), 58, gy - 34 - v.pop.t * 14);
          ctx.globalAlpha = 1;
        } else v.pop = null;
      }
    });
  }
}

    for (const id of ['strike', 'heal', 'rage']) {
      const b = $('#cs-' + id), left = g.cdLeft(id), cdv = b.querySelector('.cdv');
      cdv.hidden = left <= 0 && s.mode === 'fight';
      cdv.textContent = s.mode !== 'fight' ? '—' : Math.ceil(left) + 's';
      b.classList.toggle('ready', left <= 0 && s.mode === 'fight');
    }
    const auto = $('#autoCast');
    auto.textContent = s.skills.combat.lv < 100 ? '자동 시전 🔒' : s.act.autoCast ? '자동 시전 켜짐' : '자동 시전 꺼짐';
    auto.classList.toggle('on', !!s.act.autoCast && s.skills.combat.lv >= 100);
    const fv = $('#fever');
    const on = g.fever();
    fv.classList.toggle('on', on);
    $('#feverTxt').textContent = on ? `열정 폭발! ${Math.ceil(s.act.feverUntil - s.time)}초` : `열정 ${Math.floor(s.act.fever)}%`;
    $('#feverFill').style.width = on ? '100%' : s.act.fever + '%';
  }

  // ---------- Tutorial & tips ----------
  buildTutor() {
    const box = document.createElement('div');
    box.id = 'tutor';
    box.hidden = true;
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-live', 'polite');
    box.appendChild(iconCanvas('camp', '#ff8a3d', 44));
    box.firstChild.classList.add('tt-icon');
    box.insertAdjacentHTML('beforeend', '<div><div class="tt-step"></div><div class="tt-text"></div><div class="tt-btns"></div></div>');
    document.body.appendChild(box);
    this.tutBox = box;
    this.tipQueue = [];
    this.tip = null;
    this.tutKey = '';
  }
  tutButton(label, fn, cls = 'pbtn') {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }
  setHighlight(sel) {
    if (this.hlSel === sel && (!sel || document.querySelector(sel)?.classList.contains('tut-hl'))) return;
    document.querySelectorAll('.tut-hl').forEach(el => el.classList.remove('tut-hl'));
    this.hlSel = sel;
    if (sel) { const el = document.querySelector(sel); if (el) el.classList.add('tut-hl'); }
  }
  restartTutorial() {
    this.g.s.tut = { step: 1, done: false, tips: this.g.s.tut.tips || {} };
    this.tutKey = '';
    this.close();
  }
  showTip(id, html, target) {
    const tut = this.g.s.tut;
    if (tut.tips[id] || this.tipQueue.some(t => t.id === id) || (this.tip && this.tip.id === id)) return;
    this.tipQueue.push({ id, html, target });
  }
  tutTick() {
    const g = this.g, tut = g.s.tut, box = this.tutBox;
    const modalOpen = !document.getElementById('modal').hidden;
    if (!tut.done) {
      let step = TUT[tut.step];
      while (step && step.until && step.until(g, this)) { tut.step++; step = TUT[tut.step]; }
      if (!step) { tut.done = true; this.setHighlight(null); box.hidden = true; return; }
      box.hidden = modalOpen;
      if (modalOpen) { this.setHighlight(null); return; }
      const html = step.text(g);
      const key = tut.step + html;
      this.setHighlight(step.target || null);
      if (key === this.tutKey) return;
      this.tutKey = key;
      this.placeTutor(step.target);
      box.querySelector('.tt-step').textContent = step.start ? 'GUIDE' : `GUIDE ${tut.step}/${TUT.length - 1}`;
      box.querySelector('.tt-text').innerHTML = html;
      const btns = box.querySelector('.tt-btns');
      btns.innerHTML = '';
      const finish = () => { tut.done = true; this.tutKey = ''; this.setHighlight(null); box.hidden = true; };
      if (step.start) {
        btns.appendChild(this.tutButton('건너뛰기', finish, 'tt-skip'));
        btns.appendChild(this.tutButton('안내 시작', () => { tut.step++; this.tutTick(); }, 'pbtn big'));
      } else {
        btns.appendChild(this.tutButton('안내 끄기', finish, 'tt-skip'));
        if (step.last) btns.appendChild(this.tutButton('모험 계속', finish, 'pbtn big'));
        else if (!step.until) btns.appendChild(this.tutButton('다음', () => { tut.step++; this.tutTick(); }, 'pbtn big'));
      }
      return;
    }
    // One-time tips after the tutorial.
    if (!this.tip && this.tipQueue.length && !modalOpen) {
      this.tip = this.tipQueue.shift();
      this.placeTutor(this.tip.target);
      this.setHighlight(this.tip.target || null);
      box.querySelector('.tt-step').textContent = 'TIP';
      box.querySelector('.tt-text').innerHTML = this.tip.html;
      const btns = box.querySelector('.tt-btns');
      btns.innerHTML = '';
      btns.appendChild(this.tutButton('확인', () => { tut.tips[this.tip.id] = 1; this.tip = null; this.setHighlight(null); box.hidden = true; this.tutTick(); }, 'pbtn big'));
      box.hidden = false;
    }
    if (this.tip) box.hidden = modalOpen;
    else if (box.hidden === false && !this.tip) box.hidden = true;
  }
  placeTutor(sel) {
    const el = sel && document.querySelector(sel);
    const low = el ? el.getBoundingClientRect().top > innerHeight * 0.55 : false;
    this.tutBox.style.top = low ? '16px' : 'auto';
    this.tutBox.style.bottom = low ? 'auto' : '16px';
  }

  manualSave() {
    this.hooks.save(true);
    this.toast(`저장했습니다 · ${new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}`, 2);
  }

  toggleFocus() {
    const s = this.g.s;
    s.focus = !s.focus;
    if (s.focus && s.mode === 'fight') this.g.enterCamp('focus');
    this.toast(s.focus ? '생활 집중: 전투를 멈추고 야영지에서 생활만 합니다' : '순환: 싸우고, 지치면 야영합니다');
    this.updateBar();
  }

  updateBar() {
    const g = this.g, s = g.s, c = s.char, d = g.d;
    $('#whoSub').textContent = `윤회 ${s.rb.count}회 · LV ${c.lv}`;
    const set = (id, v, max, txt) => {
      $('#' + id + 'Fill').style.width = Math.max(0, Math.min(100, (v / max) * 100)) + '%';
      $('#' + id + 'Txt').textContent = txt;
    };
    set('hp', c.hp, d.hp, `${fmt(Math.max(0, c.hp))} / ${fmt(d.hp)}`);
    set('sta', c.sta, d.sta, `${Math.floor(c.sta)} / ${Math.floor(d.sta)}`);
    const need = charXpNeed(c.lv);
    set('xp', c.xp, need, `${fmt(c.xp)} / ${fmt(need)} (${((c.xp / need) * 100).toFixed(1)}%)`);
    const mb = $('#b-mode .lbl');
    mb.textContent = s.focus ? '집중' : '순환';
    $('#b-mode').classList.toggle('on', s.focus);
    $('#b-char .dot').hidden = !((c.pts > 0 && !c.auto) || g.upgrades() > 0);
    const ls = this.hooks.lastSave();
    $('#b-save').title = ls ? `마지막 저장 ${new Date(ls).toLocaleTimeString('ko-KR')}` : '아직 저장 안 됨';
    $('#b-rebirth .dot').hidden = !(s.rb.choices || (g.canRebirth() && s.rb.count === 0));
    $('#b-life .dot').hidden = !s.slots.some(x => x.blocked);
    for (const id of ['char', 'life', 'bag', 'codex', 'rebirth', 'log', 'menu']) $('#b-' + id).classList.toggle('active', this.panel === id);
    this.updateHud();
    this.updateActions();
    this.tutTick();
  }

  updateHud() {
    const g = this.g, s = g.s, c = s.char, env = g.env;
    const reg = g.region(c.floor);
    const gm = s.mode === 'fight' ? g.gimmick(c.floor) : null;
    const boss = c.floor % 10 === 0;
    const timeIcon = env.night ? '🌙' : '☀️';
    const w = env.weather === 'rain' ? ' · 🌧 비 (채집 +20%)' : env.weather === 'snow' ? ' · ❄ 눈' : '';
    $('#hudTL').innerHTML = `
      <div class="reg">${esc(s.mode === 'camp' ? this.campPlace() : reg.name)}</div>
      <div class="fl">${s.mode === 'camp' ? `${esc(SKILLS[s.slots[0].k].name)} 중${s.focus ? ' · 생활 집중' : ''}` : `${c.floor}층 ${boss ? '· 보스' : `· ${c.kills}/10`}`}</div>
      <div class="env">${timeIcon} ${SEASON_NAME[env.season]}${w}${env.night ? ' · 밤낚시 희귀 ×1.3' : ''}</div>
      ${gm ? `<div class="gm ${s.pot[gm === 'poison' ? 'antidote' : 'warm'] || g.d.res[gm] >= 1 ? 'ok' : ''}">${esc(GIMMICK_TEXT[gm])}</div>` : ''}
      ${s.catUntil > s.time ? `<div class="env">✨ 행운의 촉매 ${Math.ceil((s.catUntil - s.time) / 60)}분</div>` : ''}
      ${g.recall() > 1 ? `<div class="env recall">⚡ 전생 기억 회복 중 · 경험치 ×${g.recall()} (Lv ${Math.ceil(s.rb.bestLv * 0.95)}까지)</div>` : ''}`;
    $('#goals').innerHTML = g.goals().map(t => `<li>${esc(t)}</li>`).join('');
    // Clone insets
    const holder = $('#clones');
    const n = s.slots.length - 1;
    if (holder.childElementCount !== n) {
      holder.innerHTML = '';
      const list = [];
      for (let i = 0; i < n; i++) {
        const box = document.createElement('div');
        box.className = 'clone';
        const cv = document.createElement('canvas');
        cv.width = 160;
        cv.height = 90;
        cv.className = 'px';
        box.appendChild(cv);
        const lb = document.createElement('div');
        lb.className = 'clone-lb';
        box.appendChild(lb);
        holder.appendChild(box);
        list.push(cv);
      }
      this.r.setCloneCanvases(list);
    }
    holder.querySelectorAll('.clone-lb').forEach((lb, i) => {
      const k = s.slots[i + 1].k;
      lb.textContent = `분신 ${i + 1} · ${SKILLS[k].name} Lv.${s.skills[k].lv}`;
    });
  }

  campPlace() {
    const s = this.g.s, k = s.slots[0].k;
    if (!SPOTS[k]) return '연금술 공방';
    return SPOTS[k][Math.min(s.spots[k] || 0, spotsUnlocked(s.skills[k].lv) - 1)].name;
  }

  toast(text, tier = 0) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.style.setProperty('--tc', TIERS[Math.min(6, tier)].color);
    t.textContent = text;
    $('#toasts').appendChild(t);
    setTimeout(() => t.remove(), 3200);
    const all = $('#toasts').children;
    if (all.length > 4) all[0].remove();
  }

  handle(events) {
    for (const e of events) {
      if (e.t === 'slv' && (e.lv % 10 === 0 || e.lv < 10)) this.toast(`${SKILLS[e.k].name} Lv.${e.lv}${e.m ? ' · ' + e.m : ''}`, e.lv % 100 === 0 ? 4 : 1);
      else if (e.t === 'codex') { const it = ITEMS[e.id]; this.toast(`도감 등록 · ${it.name}`, it.tier); }
      else if (e.t === 'gear' && e.equip && e.g.tier >= 1) this.toast(`장착 · [${TIERS[e.g.tier].name}] ${gearName(e.g)}`, e.g.tier);
      else if (e.t === 'gear' && !e.equip) {
        if (e.better || e.g.tier >= 2) this.toast(`장비 획득 · [${TIERS[e.g.tier].name}] ${gearName(e.g)}${e.better ? ' ▲' : ''} (가방)`, e.g.tier);
        this.showTip('gear', '장비를 얻었어요! <b>「캐릭터」</b>에서 <b>착용</b>을 눌러 입으세요. 더 좋은 장비가 가방에 있으면 버튼에 빨간 점이 뜹니다. 자동 착용은 같은 곳에서 켤 수 있어요.', '#b-char');
      }
      else if (e.t === 'floor' && e.floor % 10 === 1) this.toast(`${e.floor}층 · ${this.g.region(e.floor).name}`, 2);
      else if (e.t === 'unlock') {
        this.toast(`새 생활 스킬 해금 · ${SKILLS[e.k].name}`, 4);
        if (e.k !== 'wood') this.showTip('unlock_' + e.k, `<b>${SKILLS[e.k].name}</b>이(가) 열렸어요! 「생활」에서 카드를 고르고 「야영에 배치」를 눌러 보세요.`, '#b-life');
      } else if (e.t === 'spawn' && e.mon.boss) this.showTip('boss', '<b>보스</b>가 나타났어요! 보스는 <b>네 번째 공격마다 강타</b>를 날립니다. 쓰러지면 한 층 아래에서 힘을 길러 다시 도전해요.');
      else if (e.t === 'spawn' && e.mon.elite) this.showTip('elite', '<b>정예 몬스터</b>는 5층마다 한 마리만 나와요. 쓰러뜨리면 다음 층으로, 처음 잡으면 장비 보상이 확정입니다.');
      else if (e.t === 'death') this.showTip('death', '쓰러져도 잃는 건 없어요. <b>한 층 아래</b>에서 3분간 힘을 기른 뒤 다시 올라갑니다. 생활 스킬과 장비 강화로 더 강해지세요.');
    }
    if (this.g.canRebirth() && this.g.s.rb.count === 0) this.showTip('rebirth', '<b>윤회</b>가 열렸어요! 레벨과 장비는 초기화되지만 <b>모닥불의 재</b>로 영구 특성을 얻고, 생활 레벨은 그대로 남아요.', '#b-rebirth');
  }

  // ---------- Panel ----------
  buildPanel() {
    $('#panelClose').addEventListener('click', () => this.close());
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (!$('#modal').hidden && !this.modalLocked) this.closeModal();
        else this.close();
      }
    });
  }
  toggle(id) {
    if (this.panel === id) this.close();
    else this.open(id);
  }
  open(id) {
    this.panel = id;
    $('#panel').hidden = false;
    $('#panel').dataset.kind = id;
    this.confirm = null;
    this.renderPanel();
    this.updateBar();
  }
  close() {
    this.panel = null;
    $('#panel').hidden = true;
    this.updateBar();
  }
  refreshPanel() {
    if (!this.panel || this.pointerDown) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT')) return;
    this.renderPanel();
  }
  renderPanel() {
    const body = $('#panelBody');
    const scroll = body.scrollTop;
    const focusId = document.activeElement && body.contains(document.activeElement) ? document.activeElement.dataset.fid : null;
    const titles = { char: '캐릭터 정보', life: '생활 스킬', bag: '가방', codex: '도감', rebirth: '윤회', log: '모험 일지', menu: '설정' };
    $('#panelTitle').textContent = titles[this.panel];
    body.innerHTML = '';
    this['p_' + this.panel](body);
    body.scrollTop = scroll;
    if (focusId) { const el = body.querySelector(`[data-fid="${focusId}"]`); if (el) el.focus(); }
  }
  act(fn) {
    fn();
    this.g.calc();
    this.renderPanel();
    this.updateBar();
  }
  btn(label, onClick, opts = {}) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pbtn' + (opts.cls ? ' ' + opts.cls : '');
    b.innerHTML = label;
    if (opts.fid) b.dataset.fid = opts.fid;
    b.disabled = !!opts.disabled;
    b.addEventListener('click', () => this.act(onClick));
    return b;
  }
  section(parent, title) {
    const sec = document.createElement('section');
    sec.className = 'psec';
    if (title) {
      const h = document.createElement('h3');
      h.textContent = title;
      sec.appendChild(h);
    }
    parent.appendChild(sec);
    return sec;
  }
  html(parent, markup, cls) {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.innerHTML = markup;
    parent.appendChild(d);
    return d;
  }

  // ----- Character
  p_char(body) {
    const g = this.g, s = g.s, c = s.char, d = g.d;
    const top = this.html(body, '', 'char-top');
    const pic = document.createElement('canvas');
    pic.width = HERO[0].length; pic.height = HERO.length;
    pic.className = 'px char-pic';
    pic.getContext('2d').drawImage(sprite('hero', HERO, HERO_PAL), 0, 0);
    top.appendChild(pic);
    const titles = Object.keys(MASTER_TITLE).filter(k => s.skills[k].lv >= 1000).map(k => MASTER_TITLE[k]);
    this.html(top, `<div class="char-nm">모험가 <span class="lv">LV ${c.lv}</span></div>
      <div class="char-sub">윤회 ${s.rb.count}회 · 최고 ${s.rb.bestFloor}층${titles.length ? ' · ' + titles.join(', ') : ''}</div>
      <div class="char-sub">${s.rb.memory ? `전생의 기억: <b>${esc(MEMORIES[s.rb.memory].name)}</b> (${esc(MEMORIES[s.rb.memory].desc)})` : '전생의 기억 없음'}</div>`, 'char-meta');

    const st = this.section(body, '능력치');
    const rows = [
      ['최대 HP', fmt(d.hp)], ['공격력', fmt(d.atk)], ['공격 간격', d.interval.toFixed(2) + '초'],
      ['치명타 확률', pct(d.critC)], ['치명타 피해', '×' + d.critD.toFixed(2)], ['회피', pct(d.dodge)],
      ['최대 스태미나', Math.floor(d.sta)], ['행운 배율', `×${d.luck.toFixed(2)} (상한 ×${d.luckCap.toFixed(1)})`],
      ['도감 보너스', '+' + pct(d.codex)], ['골드', fmt(c.gold)],
    ];
    this.html(st, rows.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join(''), 'statlist');

    const al = this.section(body, `스탯 분배 · 남은 포인트 ${c.pts}`);
    const grid = this.html(al, '', 'alloc');
    for (const k of Object.keys(STAT_NAMES)) {
      const row = this.html(grid, `<span>${STAT_NAMES[k]}</span><b>${c.st[k]}</b>`, 'alloc-row');
      row.appendChild(this.btn('+1', () => g.allocate(k, 1), { disabled: c.pts < 1, fid: 'a1' + k }));
      row.appendChild(this.btn('+10', () => g.allocate(k, 10), { disabled: c.pts < 1, fid: 'a10' + k }));
    }
    const pr = this.html(al, '', 'chips');
    for (const [k, p] of Object.entries(PRESETS)) {
      pr.appendChild(this.btn(p.name, () => { c.preset = k; if (c.auto) g.respec(); }, { cls: c.preset === k ? 'chip on' : 'chip' }));
    }
    pr.appendChild(this.btn(c.auto ? '자동 분배 켜짐' : '자동 분배 꺼짐', () => { c.auto = !c.auto; if (c.auto) g.autoAllocate(); }, { cls: c.auto ? 'chip on' : 'chip' }));
    pr.appendChild(this.btn('초기화', () => g.respec(), { cls: 'chip' }));

    const ge = this.section(body, '장비 (윤회 시 초기화)');
    for (const slot of ['weapon', 'armor', 'charm']) {
      const gg = c.gear[slot];
      const row = this.html(ge, '', 'gear-row');
      row.appendChild(iconCanvas(slot === 'weapon' ? 'sword' : slot === 'armor' ? 'armor' : 'charm', gg ? TIERS[gg.tier].color : '#5a5a66', 32));
      if (gg) {
        const val = slot === 'charm' ? `행운 +${charmValue(gg).luck.toFixed(3)} · 치명 +${pct(charmValue(gg).crit)}` : `${slot === 'weapon' ? '공격력' : 'HP'} +${fmt(gearValue(gg))}`;
        this.html(row, `<b style="color:${TIERS[gg.tier].color}">[${TIERS[gg.tier].name}] ${esc(gearName(gg))}</b><small>${gg.f}층 · ${val}</small>`, 'gear-txt');
        const cost = enhanceCost(gg);
        const btns = this.html(row, '', 'gear-btns');
        btns.appendChild(this.btn(`강화 ${fmt(cost)}g`, () => g.enhance(slot), { disabled: c.gold < cost, fid: 'en' + slot }));
        btns.appendChild(this.btn('해제', () => g.unequip(slot), { cls: 'chip', fid: 'uq' + slot }));
      } else this.html(row, '<b>비어 있음</b><small>가방에서 장비를 골라 착용하세요</small>', 'gear-txt');
    }
    const bag = this.section(body, `가방의 장비 ${c.bag.length}/${BAG_MAX}`);
    const ctl = this.html(bag, '', 'chips');
    ctl.appendChild(this.btn(s.settings.autoEquip ? '자동 착용 켜짐' : '자동 착용 꺼짐', () => { s.settings.autoEquip = !s.settings.autoEquip; }, { cls: 'chip' + (s.settings.autoEquip ? ' on' : ''), fid: 'autoeq' }));
    if (c.bag.length) {
      if (this.confirm === 'sellall') {
        ctl.appendChild(this.btn(`정말 ${c.bag.length}개 판매`, () => { g.sellAll(); this.confirm = null; }, { cls: 'danger', fid: 'sa2' }));
        ctl.appendChild(this.btn('취소', () => { this.confirm = null; }, { cls: 'chip', fid: 'sa3' }));
      } else ctl.appendChild(this.btn('전부 판매', () => { this.confirm = 'sellall'; }, { cls: 'chip', fid: 'sa' }));
    }
    if (!c.bag.length) this.html(bag, '<p class="hint">몬스터가 떨어뜨린 장비가 여기에 모입니다. 가방이 가득 차면 가장 약한 장비부터 자동으로 팔려요.</p>');
    const order = c.bag.map((x, i) => ({ x, i })).sort((a, b) => (a.x.slot > b.x.slot ? 1 : a.x.slot < b.x.slot ? -1 : gearScore(b.x) - gearScore(a.x)));
    for (const { x, i } of order) {
      const cur = c.gear[x.slot];
      const diff = cur ? gearScore(x) / gearScore(cur) - 1 : 1;
      const row = this.html(bag, '', 'gear-row');
      row.appendChild(iconCanvas(x.slot === 'weapon' ? 'sword' : x.slot === 'armor' ? 'armor' : 'charm', TIERS[x.tier].color, 28));
      const val = x.slot === 'charm' ? `행운 +${charmValue(x).luck.toFixed(3)} · 치명 +${pct(charmValue(x).crit)}` : `${x.slot === 'weapon' ? '공격력' : 'HP'} +${fmt(gearValue(x))}`;
      const cmp = !cur ? '<em class="up">새 부위</em>' : diff > 0.001 ? `<em class="up">▲ ${pct(diff, 0)}</em>` : diff < -0.001 ? `<em class="down">▼ ${pct(-diff, 0)}</em>` : '<em>같음</em>';
      this.html(row, `<b style="color:${TIERS[x.tier].color}">[${TIERS[x.tier].name}] ${esc(gearName(x))} ${cmp}</b><small>${x.f}층 · ${val}</small>`, 'gear-txt');
      const btns = this.html(row, '', 'gear-btns');
      btns.appendChild(this.btn('착용', () => g.equip(i), { cls: diff > 0 ? 'big' : '', fid: 'eq' + i }));
      btns.appendChild(this.btn(`판매 ${fmt(sellPrice(x))}g`, () => g.sell(i), { cls: 'chip', fid: 'sl' + i }));
    }
  }

  // ----- Life skills
  p_life(body) {
    const g = this.g, s = g.s;
    const sl = this.section(body, '배치 · 야영 중에는 야영 슬롯, 분신은 항상 일합니다');
    const chips = this.html(sl, '', 'slots');
    s.slots.forEach((x, i) => {
      const el = this.html(chips, `<small>${i === 0 ? '야영' : '분신 ' + i}</small><b>${SKILLS[x.k].name}</b>${x.blocked ? '<em>재료 부족</em>' : ''}`, 'slot' + (i === 0 ? ' main' : ''));
      el.prepend(skillIcon(x.k, 26));
    });
    if (s.slots.length < 3) this.html(sl, `<p class="hint">분신 슬롯은 윤회 특성 「분신술」로 늘어납니다 (${s.slots.length - 1}/2)</p>`);

    const pick = this.html(body, '', 'chips');
    this.html(pick, '<small class="hint">상세 보기:</small>');
    for (const k of Object.keys(SKILLS)) pick.appendChild(this.btn(SKILLS[k].short, () => { this.sel.skill = k; }, { cls: 'chip' + (this.sel.skill === k ? ' on' : ''), fid: 'dv' + k }));
    const grid = this.html(body, '', 'skill-grid');
    for (const k of Object.keys(SKILLS)) {
      const sk = s.skills[k];
      const card = document.createElement('button');
      card.type = 'button';
      const open = g.unlocked(k), u = UNLOCKS[k];
      card.className = 'skill-card' + (this.sel.skill === k ? ' sel' : '') + (open ? '' : ' locked');
      card.dataset.fid = 'sk' + k;
      card.appendChild(open ? skillIcon(k, 30) : iconCanvas(SKILL_ICON[k][0], '#3a3a48', 30));
      const need = xpNeed(sk.lv);
      card.title = open && k !== 'combat' ? '누르면 바로 이 일을 하러 갑니다' : '';
      card.insertAdjacentHTML('beforeend', open ? `<div class="sc-nm">${SKILLS[k].name}</div><div class="sc-lv">Lv.${sk.lv}</div>
        <div class="sc-bar"><i style="width:${(sk.xp / need) * 100}%"></i></div>
        <div class="sc-tool">${k === 'combat' ? '처치로 성장' : TOOL_TIERS[toolTier(sk.lv)].name + ' 도구'}</div>` : `<div class="sc-nm">🔒 ${SKILLS[k].name}</div><div class="sc-lv">잠김</div>
        <div class="sc-lock">${SKILLS[u.skill].name} Lv.${u.lv} 필요 (지금 ${s.skills[u.skill].lv})</div>`);
      card.addEventListener('click', () => { this.sel.skill = k; if (k === 'combat' || !open) this.renderPanel(); else this.goSkill(k); });
      if (open && k !== 'combat') card.insertAdjacentHTML('beforeend', '<span class="sc-go">▶ 하러 가기</span>');
      grid.appendChild(card);
    }
    this.skillDetail(body, this.sel.skill);
  }

  skillDetail(body, k) {
    const g = this.g, s = g.s, sk = s.skills[k];
    const det = this.section(body, `${SKILLS[k].name} Lv.${sk.lv}`);
    const need = xpNeed(sk.lv);
    const pb = skillPassive(sk.lv);
    const speed = k === 'combat' ? null : g.skillSpeed(k);
    const mult = g.rareMult(k);
    const eP = 1 / (1e-6 * Math.sqrt(mult));
    this.html(det, `
      <div><span>경험치</span><b>${fmt(sk.xp)} / ${fmt(need)}</b></div>
      <div><span>패시브 (${esc(SKILLS[k].stat)})</span><b>+${k === 'fish' ? (sk.lv * 0.0005 + Math.floor(sk.lv / 10) * 0.005).toFixed(3) + ' 행운' : pct(pb)}</b></div>
      ${speed ? `<div><span>작업 속도</span><b>×${speed.toFixed(2)}</b></div>` : ''}
      <div><span>희귀 이상 확률 배율</span><b>×${mult.toFixed(2)}</b></div>
      <div><span>누적 행동</span><b>${sk.n.toLocaleString()}회</b></div>
      <div><span>불운 게이지 (태초)</span><b>${((sk.dryP / eP) * 100).toFixed(1)}%${pity(sk.dryP / eP) > 1 ? ` · 확률 ×${pity(sk.dryP / eP).toFixed(2)}` : ''}</b></div>`, 'statlist');
    if (k !== 'combat' && !g.unlocked(k)) {
      const u = UNLOCKS[k];
      this.html(det, `<p class="warn">🔒 ${SKILLS[u.skill].name}을(를) Lv.${u.lv}까지 올리면 열립니다 (지금 Lv.${s.skills[u.skill].lv}).</p>`);
    } else if (k !== 'combat') {
      const row = this.html(det, '', 'chips');
      s.slots.forEach((x, i) => {
        row.appendChild(this.btn(x.k === k ? `${i === 0 ? '야영' : '분신 ' + i} 배치됨` : `${i === 0 ? '야영' : '분신 ' + i}에 배치`, () => g.setSlotSkill(i, k), { cls: x.k === k ? 'chip on' : 'chip', fid: 'as' + i }));
      });
    }
    // Milestones
    const ms = nextMilestones(k, sk.lv, 5);
    this.html(det, `<h4>다음 보상</h4><ul class="ms">${ms.map(m => `<li class="${m.lv % 100 === 0 || m.lv >= 250 ? 'big' : ''}"><b>Lv.${m.lv}</b> ${esc(m.text)}</li>`).join('')}</ul>`);
    // Spots
    if (SPOTS[k]) {
      const sp = this.section(body, '장소');
      const unlocked = spotsUnlocked(sk.lv);
      SPOTS[k].forEach((spot, i) => {
        const locked = i >= unlocked;
        const row = this.html(sp, '', 'spot' + (s.spots[k] === i ? ' on' : '') + (locked ? ' locked' : ''));
        const icons = this.html(row, '', 'spot-icons');
        for (const id of spot.items) icons.appendChild(s.codex[id] || !locked ? itemIcon(id, 22) : iconCanvas(ITEMS[id].icon, '#2a2a34', 22));
        this.html(row, `<b>${esc(spot.name)}</b><small>${locked ? `Lv.${SPOT_LV[i]} 필요` : `경험치 ${[8, 14, 24, 40, 65][i]}/회`}</small>`, 'spot-txt');
        if (!locked) row.appendChild(this.btn(s.spots[k] === i ? '선택됨' : '선택', () => { s.spots[k] = i; }, { cls: 'chip' + (s.spots[k] === i ? ' on' : ''), fid: 'sp' + i }));
      });
    }
    if (k === 'alchemy') this.alchemyDetail(body);
    // Skill-wide rares
    const rr = this.section(body, '희귀 보상 (모든 장소 공통)');
    const ul = this.html(rr, '', 'rares');
    SKILL_RARES[k].forEach((id, i) => {
      const it = ITEMS[id], known = s.codex[id];
      const r = this.html(ul, `<div><b style="color:${TIERS[it.tier].color}">${known ? esc(it.name) : '???'}</b><small>${TIERS[it.tier].name} · ${{ 3: '0.3%', 4: '0.02%', 5: '0.002%', 6: '0.0001%' }[it.tier]}${it.effect && known ? ' · ' + esc(it.effect) : ''}${known ? ` · 보유 ${s.items[id] || 0}` : ''}</small></div>`, 'rare-row');
      r.prepend(known ? itemIcon(id, 26) : iconCanvas(it.icon, '#2a2a34', 26));
    });
  }

  alchemyDetail(body) {
    const g = this.g, s = g.s, lv = s.skills.alchemy.lv;
    const sec = this.section(body, '레시피');
    for (const r of RECIPES) {
      if (r.secret && !s.secret) continue;
      const it = ITEMS[r.id];
      const locked = lv < r.lv;
      const done = r.max && g.crafted(r) >= r.max;
      const row = this.html(sec, '', 'recipe' + (s.recipe === r.id ? ' on' : '') + (locked ? ' locked' : ''));
      row.appendChild(itemIcon(r.id, 30));
      const ins = Object.entries(r.in).map(([id, n]) => {
        const have = s.items[id] || 0;
        return `<span class="${have >= n ? 'ok' : 'no'}">${esc(ITEMS[id].name)} ${fmt(have)}/${n}</span>`;
      }).join('');
      this.html(row, `<b>${esc(it.name)}${r.max ? ` <small>(${g.crafted(r)}/${r.max})</small>` : ` <small>보유 ${s.items[r.id] || 0}</small>`}</b>
        <small>${esc(it.desc || '')}</small><div class="ins">${locked ? `연금술 Lv.${r.lv} 필요` : ins}</div>`, 'recipe-txt');
      if (!locked && !done) row.appendChild(this.btn(s.recipe === r.id ? '제작 중' : '선택', () => { s.recipe = r.id; }, { cls: 'chip' + (s.recipe === r.id ? ' on' : ''), fid: 'rc' + r.id }));
    }
    const pa = this.section(body, '물약 자동 사용 (전투 시작 시 1개씩)');
    const chips = this.html(pa, '', 'chips');
    for (const id of ['p_str', 'p_hp', 'p_sta', 'p_luck', 'p_haste', 'p_focus', 'p_wisdom', 'p_antidote', 'p_warm']) {
      const type = ITEMS[id].potion;
      chips.appendChild(this.btn(`${ITEMS[id].name} ${s.potAuto[type] ? 'ON' : 'OFF'} · ${s.items[id] || 0}`, () => { s.potAuto[type] = !s.potAuto[type]; }, { cls: 'chip' + (s.potAuto[type] ? ' on' : ''), fid: 'pa' + id }));
    }
    this.html(pa, '<p class="hint">해독·온기 물약은 해당 지역에서 저항이 부족할 때만 사용됩니다. 실패해도 경험치는 1.5배를 받습니다.</p>');
  }

  // ----- Bag
  p_bag(body) {
    const s = this.g.s;
    const tabs = this.html(body, '', 'chips');
    const cats = { mat: '재료', pot: '물약·영약', rare: '영웅 이상' };
    for (const [k, v] of Object.entries(cats)) tabs.appendChild(this.btn(v, () => { this.sel.bag = k; this.sel.item = null; }, { cls: 'chip' + (this.sel.bag === k ? ' on' : ''), fid: 'bt' + k }));
    const ids = Object.keys(s.items).filter(id => s.items[id] > 0).filter(id => {
      const it = ITEMS[id];
      if (this.sel.bag === 'rare') return it.tier >= 3;
      if (this.sel.bag === 'pot') return it.skill === 'alchemy' && it.tier < 3;
      return it.tier < 3 && it.skill !== 'alchemy';
    }).sort((a, b) => ITEMS[b].tier - ITEMS[a].tier || (ITEMS[a].skill > ITEMS[b].skill ? 1 : -1));
    const grid = this.html(body, '', 'slotgrid');
    if (!ids.length) this.html(grid, '<p class="hint">아직 비어 있어요. 야영지에서 생활 스킬을 돌려보세요.</p>');
    for (const id of ids) {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell t' + ITEMS[id].tier + (this.sel.item === id ? ' sel' : '');
      cell.dataset.fid = 'it' + id;
      cell.appendChild(itemIcon(id, 34));
      cell.insertAdjacentHTML('beforeend', `<span class="cnt">${fmt(s.items[id])}</span>`);
      cell.addEventListener('click', () => { this.sel.item = id; this.renderPanel(); });
      grid.appendChild(cell);
    }
    if (this.sel.item && s.items[this.sel.item] > 0) this.itemInfo(body, this.sel.item);
  }
  itemInfo(body, id) {
    const s = this.g.s, it = ITEMS[id];
    const box = this.section(body);
    box.classList.add('iteminfo');
    box.appendChild(itemIcon(id, 40));
    const src = it.skill === 'combat' ? '전투' : SKILLS[it.skill].name;
    this.html(box, `<b style="color:${TIERS[it.tier].color}">${esc(it.name)}</b>
      <small>${TIERS[it.tier].name} · ${src} · 보유 ${fmt(s.items[id] || 0)}${s.records[id] ? ` · 최고 ${s.records[id]}kg` : ''}</small>
      <small>${esc(it.effect || it.desc || '도감 보너스 +' + pct(TIERS[it.tier].codex))}</small>`, 'ii-txt');
    if (id === 'x_cat' || it.use) box.appendChild(this.btn('사용', () => this.g.useItem(id), { fid: 'use' }));
  }

  // ----- Codex
  p_codex(body) {
    const g = this.g, s = g.s;
    const all = Object.keys(ITEMS);
    const found = all.filter(id => s.codex[id]).length;
    this.html(body, `<div class="codex-head"><b>${found} / ${all.length}</b> 등록 · 도감 보너스 <b>+${pct(g.d.codex)}</b> (공격력·HP)</div>`);
    const tabs = this.html(body, '', 'chips');
    for (const k of Object.keys(SKILLS)) tabs.appendChild(this.btn(SKILLS[k].short, () => { this.sel.codex = k; this.sel.item = null; }, { cls: 'chip' + (this.sel.codex === k ? ' on' : ''), fid: 'cx' + k }));
    const ids = all.filter(id => ITEMS[id].skill === this.sel.codex);
    const n = ids.filter(id => s.codex[id]).length;
    this.html(body, `<p class="hint">${SKILLS[this.sel.codex].name}: ${n}/${ids.length} · 등급별 보너스 일반 +0.2% … 태초 +20%${this.sel.codex === 'fish' ? ' · 계절 물고기는 해당 계절에만 낚입니다' : ''}</p>`);
    const grid = this.html(body, '', 'slotgrid');
    for (const id of ids) {
      const it = ITEMS[id], known = s.codex[id];
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell t' + it.tier + (known ? '' : ' unknown') + (this.sel.item === id ? ' sel' : '');
      cell.dataset.fid = 'cx' + id;
      cell.appendChild(known ? itemIcon(id, 34) : iconCanvas(it.icon, '#22222c', 34));
      cell.addEventListener('click', () => { this.sel.item = id; this.renderPanel(); });
      grid.appendChild(cell);
    }
    const id = this.sel.item;
    if (id && ITEMS[id].skill === this.sel.codex) {
      if (s.codex[id]) this.itemInfo(body, id);
      else {
        const it = ITEMS[id];
        const season = it.season !== undefined ? ` · ${SEASON_NAME[it.season]} 한정` : '';
        this.html(this.section(body), `<b>??? </b><small>${TIERS[it.tier].name}${season} · 아직 발견하지 못했습니다</small>`, 'ii-txt');
      }
    }
    if (this.sel.codex === 'fish') {
      const recs = Object.entries(s.records).sort((a, b) => b[1] / ITEMS[b[0]].w - a[1] / ITEMS[a[0]].w).slice(0, 8);
      if (recs.length) this.html(this.section(body, '어종별 최고 기록'), recs.map(([fid, w]) => `<div><span>${esc(ITEMS[fid].name)}</span><b>${w}kg</b></div>`).join(''), 'statlist');
    }
  }

  // ----- Rebirth
  p_rebirth(body) {
    const g = this.g, s = g.s, rb = s.rb, c = s.char;
    if (rb.choices) {
      const sec = this.section(body, '전생의 기억을 하나 고르세요 (이번 회차 동안 적용)');
      const row = this.html(sec, '', 'memories');
      for (const k of rb.choices) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'memory';
        b.innerHTML = `<b>${esc(MEMORIES[k].name)}</b><small>${esc(MEMORIES[k].desc)}</small>`;
        b.addEventListener('click', () => this.act(() => g.chooseMemory(k)));
        row.appendChild(b);
      }
    }
    const gain = ashFor(c.maxFloor);
    const top = this.section(body, '모닥불의 재');
    this.html(top, `<div class="ash"><b>${fmt(rb.ash)}</b><small>보유 · 누적 ${fmt(rb.totalAsh)}</small></div>
      <div class="statlist"><div><span>이번 회차 최고층</span><b>${c.maxFloor}층</b></div>
      <div><span>지금 윤회하면</span><b>재 +${gain}</b></div>
      <div><span>영구 경험치 보너스</span><b>+${Math.round((g.rebirthXp() - 1) * 100)}% (윤회 1회마다 +5%)</b></div>
      <div><span>전생 기억 회복</span><b>최고 Lv ${s.rb.bestLv}의 95%까지 경험치 ×5, 처치마다 최소 레벨업의 20%</b></div></div>
      <p class="hint">유지: 생활·전투 숙련 레벨, 도감, 재료, 영약, 기록 · 초기화: 캐릭터 레벨, 스탯, 장비, 골드, 층</p>`);
    if (!g.canRebirth()) this.html(top, '<p class="hint">21층에 도달하면 윤회할 수 있습니다. 재는 (최고층 ÷ 5)^1.5 만큼 얻습니다.</p>');
    else if (this.confirm === 'rebirth') {
      const row = this.html(top, '<p class="warn">정말 윤회할까요? 장비와 레벨이 초기화됩니다.</p>', 'confirm');
      row.appendChild(this.btn('윤회한다', () => { g.rebirth(); this.confirm = null; }, { cls: 'danger', fid: 'rbyes' }));
      row.appendChild(this.btn('취소', () => { this.confirm = null; }, { fid: 'rbno' }));
    } else top.appendChild(this.btn(`윤회하기 (재 +${gain})`, () => { this.confirm = 'rebirth'; }, { cls: 'big', fid: 'rb' }));

    const trees = this.html(body, '', 'perk-trees');
    for (const [tk, tname] of Object.entries(PERK_TREES)) {
      const col = this.section(trees, tname);
      col.classList.add('tree-' + tk);
      for (const [id, p] of Object.entries(PERKS)) {
