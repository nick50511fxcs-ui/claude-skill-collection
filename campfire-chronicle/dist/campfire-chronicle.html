/* Portrait 9:16 stage: the canvas fills it; HUD, controls and panels float on top.

(() => {
'use strict';
const __m = {};
__m.rng = (() => {
// Seeded RNG (mulberry32). The state lives in the save file, so reloading the
// page replays the same rolls instead of re-rolling a rare drop.
function makeRng(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.getState = () => s;
  return rng;
}

// Cheap deterministic hash for things derived from the wall clock (weather).
function hash32(n) {
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

return { makeRng, hash32 };
})();

__m.data = (() => {
// Static game data for the mining game: layers and ores, gear tiers, stat upgrades,
// abilities, relics, village buildings and missions. Player-facing text is Korean.

const COLS = 9;
const LAYER_SIZE = 100; // floors per layer; a new ore appears in each layer

// One ore per layer. Deeper ores are worth more and build better gear.
const ORES = [
  { id: 'copper', name: '구리', color: '#e08a4a' },
  { id: 'iron', name: '철', color: '#b8b0a8' },
  { id: 'silver', name: '은', color: '#e6ecf5' },
  { id: 'gold', name: '금', color: '#ffd34d' },
  { id: 'sapphire', name: '사파이어', color: '#3d7cff' },
  { id: 'mithril', name: '미스릴', color: '#7fe3ff' },
  { id: 'adamant', name: '아다만타이트', color: '#b06aff' },
  { id: 'orichalc', name: '오리할콘', color: '#ff8a3d' },
  { id: 'aether', name: '에테르', color: '#9affd8' },
  { id: 'prime', name: '태초석', color: '#fff3a0' },
];
const ORE = Object.fromEntries(ORES.map((o, i) => [o.id, { ...o, i }]));

// Rock colours per layer (cycled past the last one, darker each cycle).
const LAYERS = [
  { name: '흙층', rock: '#8a5a3a', bg: '#3a2418' },
  { name: '암석층', rock: '#7a7a86', bg: '#2a2a34' },
  { name: '화강암층', rock: '#9a7a7a', bg: '#34262a' },
  { name: '용암층', rock: '#8a3a2a', bg: '#2a1210' },
  { name: '수정층', rock: '#4a5a9a', bg: '#1a1e3a' },
  { name: '심층', rock: '#3a6a6a', bg: '#122426' },
  { name: '자수정층', rock: '#5a3a7a', bg: '#1e1228' },
  { name: '화염층', rock: '#9a5a2a', bg: '#2e1608' },
  { name: '별빛층', rock: '#3a3a6a', bg: '#10102a' },
  { name: '태초층', rock: '#6a6a5a', bg: '#1a1a14' },
];

// Gear: tier 0 is the starter piece; tier k (1-10) is crafted from ore k-1.
const GEAR_TIERS = ['나무', ...ORES.map(o => o.name)];
const GEAR = {
  pick: { name: '곡괭이', icon: 'pick', stat: '공격력', val: t => Math.round(2 * Math.pow(2.4, t)), fmt: v => `공격 ${v}` },
  helm: { name: '헬멧', icon: 'helm', stat: '내구', val: t => 6 * t, fmt: v => `내구 +${v}` },
  armor: { name: '갑옷', icon: 'armor', stat: '내구 %', val: t => 0.05 * t, fmt: v => `내구 +${Math.round(v * 100)}%` },
  boots: { name: '장화', icon: 'boots', stat: '간격', val: t => 1 - Math.pow(0.95, t), fmt: v => `간격 -${Math.round(v * 100)}%` },
  lamp: { name: '랜턴', icon: 'lamp', stat: '행운', val: t => 0.06 * t, fmt: v => `행운 +${Math.round(v * 100)}%` },
};
const GEAR_SLOTS = Object.keys(GEAR);
// Cost to craft tier t (t >= 1) of a slot: ore t-1 plus stone.
function gearCost(slot, t) {
  const k = slot === 'pick' ? 1 : 0.6;
  return { [ORES[t - 1].id]: Math.round(120 * Math.pow(1.85, t - 1) * k), stone: Math.round(200 * Math.pow(2.8, t - 1) * k) };
}

// Stat upgrades bought with stone; levels are uncapped (interval has a floor).
const UPGRADES = {
  atk: { name: '공격 강화', icon: 'pick', per: 0.08, text: lv => `공격력 +${Math.round(lv * 8)}%` },
  dur: { name: '내구 강화', icon: 'armor', per: 5, text: lv => `내구 +${lv * 5}` },
  spd: { name: '속도 강화', icon: 'boots', per: 0.03, text: lv => `간격 -${Math.round((1 - Math.pow(0.97, lv)) * 100)}%` },
  luck: { name: '행운 강화', icon: 'clover', per: 0.02, text: lv => `행운 +${lv * 2}%` },
};
const upgradeCost = (id, lv) => Math.round((id === 'atk' ? 25 : 20) * Math.pow(1.25, lv));

    },
    cloudStatus: () => cloud,
    reset: () => {
      swap(new Game(newState()));
      save(true);
      ui.close();
      ui.toast('새로 시작합니다');
    },
  };
  const ui = new UI(game, renderer, hooks);
  function swap(g) {
    game = g;
    renderer.g = g;
    ui.g = g;
    ui.mode = null;
    ui.update();
  }

  // Idle miners: pay out the time away (no cap).
  if (!fresh && !hotData.save) {
    const away = (Date.now() - state.lastSeen) / 1000;
    if (away > 60) ui.offlineReport(game.fastForward(away));
  }
  if (fresh) {
    ui.showModal(`<h2>⛏ 끝없는 광산</h2>
      <p class="lead">모닥불 곁의 광부가 땅 밑으로 끝없이 파 내려갑니다.</p>
      <ul class="report">
        <li><b>채굴 출발</b>을 누르면 곡괭이 내구가 다할 때까지 아래로 팝니다.</li>
        <li>캐 온 <b>돌과 광석</b>으로 능력치를 강화하고 더 좋은 장비를 만드세요.</li>
        <li><b>보물상자</b>에서 나온 유물은 영구 효과를 주고, 같은 유물을 또 얻으면 레벨이 올라요.</li>
        <li>깊을수록 새로운 광석이 나옵니다. 바닥은 없어요.</li>
      </ul>`, [['시작하기', 'modal-close']]);
  }

  // Input: hold a direction (keys, buttons or the block next to the miner).
  const keyDir = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowDown: 'down', s: 'down' };
  addEventListener('keydown', e => {
    if (e.target.closest?.('textarea, input')) return;
    const run = game.run;
    if (run && keyDir[e.key]) { run.input = keyDir[e.key]; e.preventDefault(); }
    else if (run && e.key === ' ') { game.frenzy(); e.preventDefault(); }
    else if (e.key === 'Escape') ui.close();
  });
  addEventListener('keyup', e => { if (game.run && keyDir[e.key] && game.run.input === keyDir[e.key]) game.run.input = null; });
  canvas.addEventListener('pointerdown', e => {
    const dir = ui.canvasDir(e.clientX, e.clientY, canvas.getBoundingClientRect());
    if (!dir) return;
    game.run.input = dir;
    canvas.setPointerCapture?.(e.pointerId);
  });
  for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, () => { if (game.run) game.run.input = null; });

  // Logic loop
  let last = performance.now();
  setInterval(() => {
    const now = performance.now();
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    game.advance(dt);
    hooks.flush();
  }, 50);

  // Render loop
  let lastF = performance.now(), uiT = 0, panelT = 0;
  const frame = now => {
    const dt = Math.min(0.05, (now - lastF) / 1000);
    lastF = now;
    renderer.frame(dt);
    uiT += dt; panelT += dt;
    if (uiT > 0.15) { uiT = 0; ui.update(); }
    if (panelT > 2) { panelT = 0; ui.refreshPanel(); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  setInterval(() => { if (!game.run) save(true); }, 300000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { bank(); hooks.flush(); save(true); } });
  addEventListener('pagehide', () => { bank(); save(); });
  (async () => {
    try {
      if (!window.claude?.use) { cloud.status = '이 환경에서는 브라우저에만 저장됩니다'; return; }
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { cloud.status = '로그인하면 클라우드 저장을 쓸 수 있습니다'; return; }
      cloud.ref = db.doc('data/users/' + uid + '/mine');
      const snap = await cloud.ref.get();
      if (snap.exists) {
        const raw = JSON.parse(snap.data().json);
        if (raw && raw.time > game.s.time + 30 && !game.run) {
          swap(new Game(migrate(raw)));
          save();
          ui.toast('클라우드에 저장된 진행을 불러왔습니다', 2);
        }
      }
      cloud.ok = true;
      cloud.status = '연결됨';
      cloudSave();
    } catch {
      cloud.status = '사용할 수 없어 브라우저에만 저장됩니다';
    }
  })();
  window.claude?.hot?.snapshot?.(() => { bank(); return { save: game.serialize() }; });
  if (location.hash === '#debug') window.__cc = { game: () => game, renderer, ui };
}

if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});

return {  };
})();
})();
</script>
